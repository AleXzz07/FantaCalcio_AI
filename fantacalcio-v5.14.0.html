function allocationFactor(role){
 let cur=roleBudget(role)/Math.max(1,state.settings.budget),
     base=Number(DEFAULT_SHARES[role]||.25),
     ratio=cur/Math.max(.001,base);

 // Elasticità < 1: se aumenti un reparto del 25%, il prezzo consigliato
 // non sale automaticamente del 25%; sale in modo smorzato.
 let factor=Math.pow(ratio,.65);
 return {
   factor:clamp(factor,.70,1.35),
   ratio,
   currentShare:cur,
   defaultShare:base
 }
}

function cleanNum(x,decimals=6){
 const n=Number(x);
 if(!Number.isFinite(n))return 0;
 const p=10**decimals;
 return Math.round((n+Number.EPSILON)*p)/p
}

 st.sessions=Array.isArray(st.sessions)&&st.sessions.length?st.sessions:d.sessions;
 if(!st.sessions.some(x=>x.id==='initial'))st.sessions.unshift(d.sessions[0]);

function intel(p){

 return {
  tier:x.tier||'BASE',target:x.target??null,cap:x.cap??null,

  penalty:x.penalty||'no',mod:x.mod||'neutro',captain:Number(x.captain||0),
  volatility:x.volatility||'media',note:x.note||''
 }
}
function inferTitularity(p){
 let pct=rankPct(p);return pct>.72?'alta':pct>.35?'media':'bassa'
}
function rankPct(p){
 let a=rolePeers[p.role],n=Math.max(2,a.length);return clamp(1-(Math.max(1,p.rank)-1)/(n-1),0,1)
}

function physicalInfo(p){

 let score=Number(d.score||60);
 let confidence=String(d.confidence||'BASSA').toUpperCase();
 let estimated=!!d.estimated;

}
function physicalLabel(p){

}
function expectedApps(p,i){
 let base=i.titularity==='alta'?32:i.titularity==='bassa'?16:24;
 let h=FANTASY_HISTORY[p.name];
 if(h&&Number(h.pv)>=30&&i.titularity==='alta')base=33;
 let ph=PHYSICAL_DATA[String(p.id)];
 if(ph&&!ph.estimated){
  if(ph.grade==='D')base=Math.round(base*.75);
  else if(ph.grade==='C')base=Math.round(base*.88);
 }
 return clamp(base,8,36)
}
function teamStrength(team){
 if(!TEAM_STRENGTH){
  let by={};PLAYERS.forEach(p=>(by[p.team]??=[]).push(Number(p.fvm||0)));
  let sums={};Object.entries(by).forEach(([t,a])=>sums[t]=a.sort((x,y)=>y-x).slice(0,14).reduce((s,x)=>s+x,0));
  let vals=Object.values(sums).sort((a,b)=>a-b),med=vals[Math.floor(vals.length/2)]||1;
  TEAM_STRENGTH={};Object.entries(sums).forEach(([t,v])=>TEAM_STRENGTH[t]=clamp(Math.pow(v/med,.16),.90,1.10));
 }
 return TEAM_STRENGTH[team]||1
}
function importContext(p){
 let c=IMPORT_CONTEXT_DATA[norm(p.name)]||null;
 if(!c)return {factor:teamStrength(p.team),label:'contesto neutrale'};
 let league=Number(c.leagueFactor||1),source=Number(c.sourceTeamFactor||1),dest=teamStrength(p.team);
 let factor=clamp((1+.45*(league-1))*(1-.20*(source-1))*(1+.45*(dest-1)),.84,1.16);
 return {factor,label:`${c.league||'estero'} · ${c.sourceTeam||'?'} → ${p.team}`}
}
function positionalPrior(p){
 let rm=String(p.rm||''),pct=rankPct(p),q=.85+.30*pct,g=0,a=0,yc=0;
 if(p.role==='D'){
  if(/[EW]/.test(rm)){g=.10;a=.14}else if(/Dd|Ds/.test(rm)){g=.065;a=.085}else{g=.075;a=.045}
  yc=/Dc/.test(rm)?.16:.13;
 }else if(p.role==='C'){
  if(/[WA]/.test(rm)){g=.18;a=.14}else if(/T/.test(rm)){g=.16;a=.15}else if(/C/.test(rm)){g=.12;a=.10}else{g=.10;a=.09}
  yc=/[MC]/.test(rm)?.15:.11;
 }else if(p.role==='A'){
  if(/Pc/.test(rm)){g=.34;a=.10}else{g=.27;a=.17}
  yc=.08;
 }
 return {g:g*q,a:a*q,yc}
}
function provenOutlier(p,h,prior){
 if(!h||Number(h.pv)<28||p.role==='P')return false;
 let hist=(3*Number(h.g||0)+1.05*Number(h.a||0))/Math.max(1,Number(h.pv));
 let generic=3*prior.g+1.05*prior.a;
 let rm=String(p.rm||'');
 let roleFit=p.role==='D'?/[EW]/.test(rm):p.role==='C'?/[WAT]/.test(rm):true;
 return roleFit&&hist>generic*1.55
}
function eventProjection(p){
 let i=intel(p),apps=expectedApps(p,i),pct=rankPct(p),rules=state.settings.rules||DEFAULT_RULES;
 if(p.role==='P'){
  let strength=teamStrength(p.team),cs=apps*(.23+.17*pct)*strength,gc=apps*(1.45-.45*pct)/strength,
      saves=(.35+.35*pct)*(apps/32),bonus=cs*rules.cleanSheet+rules.penSave*saves,malus=-rules.conceded*gc;
  return {apps,goals:0,assists:0,yc:0,rc:0,penMiss:0,bonus:r1(bonus),malus:r1(malus),net:r1(bonus-malus),source:'PRIOR PORTIERE',profile:'Portiere',historyWeight:0}
 }
 let prior=positionalPrior(p),h=FANTASY_HISTORY[p.name]||null,ctx=importSet.has(norm(p.name))?importContext(p):{factor:1,label:''};
 let priorG=prior.g*apps*ctx.factor,priorA=prior.a*apps*ctx.factor;
 let goals=priorG,assists=priorA,hw=0;
 if(h&&Number(h.pv)>=6){
  let hp=Number(h.pv),sample=clamp((hp-6)/29,0,1);
  hw=.45+.27*sample;
  if(provenOutlier(p,h,prior))hw=Math.max(hw,.84);
  hw=clamp(hw,.45,.86);
  let hg=Number(h.g||0)/hp*apps,ha=Number(h.a||0)/hp*apps;
  goals=hw*hg+(1-hw)*priorG;
  assists=hw*ha+(1-hw)*priorA;
 }
 // Penalties are NEVER stacked onto observed goals when history exists.
 // Only no-history players receive an explicit penalty-event prior.
 let penMiss=0;
 if(!h&&i.penalty!=='no'){
  let attempts=(i.penalty==='si'?2.8:1.1)*(apps/32),conv=.79;
  goals+=attempts*conv;penMiss=attempts*(1-conv)
 }else if(h&&i.penalty!=='no'){
  let attempts=(i.penalty==='si'?2.0:.8)*(apps/32);
  if(h.penAttempts!==undefined)attempts=.7*attempts+.3*(Number(h.penAttempts||0)/Math.max(1,Number(h.pv))*apps);
  penMiss=attempts*.18
 }
 let yc,rc;
 if(h&&h.yc!==undefined){
  yc=Number(h.yc||0)/Math.max(1,Number(h.pv))*apps;
  rc=Number(h.rc||0)/Math.max(1,Number(h.pv))*apps*.75
 }else{
  yc=prior.yc*apps;rc=.006*apps
 }
 let bonus=rules.goal*goals+rules.assist*assists;
 if(h&&provenOutlier(p,h,prior)){
  let direct=(rules.goal*Number(h.g||0)+rules.assist*Number(h.a||0))/Math.max(1,Number(h.pv))*apps;
  bonus=Math.max(bonus,direct*.93)
 }
 let malus=-rules.yellow*yc-rules.red*rc-rules.penMiss*penMiss;
 return {
  apps,goals:r1(goals),assists:r1(assists),yc:r1(yc),rc:r1(rc),penMiss:r1(penMiss),
  bonus:r1(bonus),malus:r1(malus),net:r1(bonus-malus),
  source:h?'STORICO FANTACALCIO + PRIOR':'PRIOR RUOLO'+(importSet.has(norm(p.name))?' + CONTESTO ESTERO':''),
  profile:profileLabel(p,i,h,prior),historyWeight:Math.round(hw*100),context:ctx.label
 }
}
function profileLabel(p,i,h,prior){
 let rm=String(p.rm||''),t=[];
 if(p.role==='D')t.push(/[EW]/.test(rm)?'Esterno offensivo':/Dd|Ds/.test(rm)?'Terzino':'Centrale');
 if(p.role==='C')t.push(/[WA]/.test(rm)?'Ala/sottopunta':/T/.test(rm)?'Trequartista':'Centrocampista');
 if(p.role==='A')t.push(/Pc/.test(rm)?'Centravanti':'Seconda punta/ala');
 if(h&&provenOutlier(p,h,prior))t.push('outlier confermato');
 if(i.penalty==='si')t.push('rigorista');
 return t.join(' · ')
}
function r1(x){return Math.round(Number(x||0)*10)/10}
function baseMV(p){
 let h=FANTASY_HISTORY[p.name],pct=rankPct(p),generic={P:5.95,D:5.95,C:5.95,A:5.92}[p.role]+.32*pct;
 return h&&h.mv!==undefined?r1(.84*Number(h.mv)+.16*generic):r1(generic)
}
function scorePlayer(p){
 let ev=eventProjection(p),mv=baseMV(p),xfm=mv+ev.net/Math.max(8,ev.apps);
 let ranges={P:[4.6,6.5],D:[5.5,7.7],C:[5.5,8.0],A:[5.5,8.8]}[p.role];
 let xScore=clamp((xfm-ranges[0])/(ranges[1]-ranges[0])*100,0,100);
 let netRanges={P:[-35,-8],D:[0,35],C:[2,45],A:[8,65]}[p.role];
 let nScore=clamp((ev.net-netRanges[0])/(netRanges[1]-netRanges[0])*100,0,100);
 let quality=Math.round(.42*(rankPct(p)*100)+.33*xScore+.20*nScore+.05*(intel(p).titularity==='alta'?100:intel(p).titularity==='media'?65:30));
 return {quality,xfm:r1(xfm),...ev,mv}
}
function rankCurve(p){
 let c=CURVES_500[p.role]||[],i=Math.max(0,Math.floor(Number(p.rank||1))-1);return Number(c[i]??1)
}
function fvm500(p){return Math.max(1,Math.round(Number(p.fvm||0)/2))}
function marketBaseline(p){
 // V5.10: FVM ufficiale = ancora principale del prezzo d'asta.
 // Target scouting e rank curve correggono, ma non possono più dominare da soli.
 let scale=state.settings.budget/500,
     officialFVM=Math.max(1,Math.round(fvm500(p)*scale)),
     i=intel(p),
     scoutRef=i.target!==null
       ?Math.max(1,Math.round(Number(i.target)*scale))
       :Math.max(1,Math.round(rankCurve(p)*scale)),
     rankRef=Math.max(1,Math.round(rankCurve(p)*scale));

 // 70% FVM ufficiale, 20% scouting, 10% curva di ruolo.
 // Se il target scouting è estremo, la sua influenza resta limitata.
 let base=Math.round(
   .70*officialFVM+
   .20*scoutRef+
   .10*rankRef
 );

 return Math.max(1,base)
}

function marketAnchors(p){
 let scale=state.settings.budget/500,
     i=intel(p),
     officialFVM=Math.max(1,Math.round(fvm500(p)*scale)),
     scoutRef=i.target!==null
       ?Math.max(1,Math.round(Number(i.target)*scale))
       :Math.max(1,Math.round(rankCurve(p)*scale)),
     rankRef=Math.max(1,Math.round(rankCurve(p)*scale));
 return {
  officialFVM,
  scoutRef,
  rankRef,
  quote:Number(p.quote||0),
  fvm:Number(p.fvm||0),
  base:marketBaseline(p)

}


const ROLE_ORDER=['P','D','C','A'];
const SCARCITY_CFG={
 P:{coef:.11,depletion:.10,max:.18},
 D:{coef:.09,depletion:.08,max:.15},
 C:{coef:.08,depletion:.07,max:.13},
 A:{coef:.12,depletion:.11,max:.24}
};

function roleBand(p){
 let maxBand=state.settings.slots[p.role]||6;
 return Math.min(maxBand,Math.max(1,Math.ceil(Math.max(1,Number(p.rank||1))/state.participants.length)))
}
function roleSpentBy(pid,role){
 return activeTransactions()
   .filter(t=>Number(t.participantId)===Number(pid)&&byId.get(t.playerId)?.role===role)
   .reduce((s,t)=>s+Number(t.price||0),0)
}
function missingRole(pid,role){
 return Math.max(0,(state.settings.slots[role]||0)-roleCount(pid,role))
}
function priorRolesComplete(role){
 let idx=ROLE_ORDER.indexOf(role);
 if(idx<=0)return true;
 let previous=ROLE_ORDER.slice(0,idx);
 return state.participants.every(team=>
   previous.every(r=>missingRole(team.id,r)===0)
 )
}

function inflationFactor(p){
 let role=p.role,band=roleBand(p);
 let rows=marketTransactions()
   .map(t=>({t,p:byId.get(t.playerId)}))
   .filter(x=>x.p?.role===role);

 if(!rows.length)return {factor:1,raw:1,roleSales:0,bandSales:0};

 let vals=rows.map(({t,p:q})=>({
   price:Number(t.price||0),
   expected:Math.max(1,marketBaseline(q)),
   band:roleBand(q)
 }));

 let paid=vals.reduce((s,x)=>s+x.price,0),
     exp=vals.reduce((s,x)=>s+x.expected,0),
     rawRole=exp>0?paid/exp:1,
     n=vals.length,
     roleF=1+(rawRole-1)*(n/(n+5));

 let same=vals.filter(x=>x.band===band),
     factor=roleF,
     raw=rawRole;

 if(same.length>=2){
   let bp=same.reduce((s,x)=>s+x.price,0),
       be=same.reduce((s,x)=>s+x.expected,0),
       br=be>0?bp/be:1,
       bn=same.length,
       bandF=1+(br-1)*(bn/(bn+3));
   factor=.68*bandF+.32*roleF;
   raw=br
 }else if(same.length===1){
   let br=same[0].price/same[0].expected,
       bandF=1+(br-1)/4;
   factor=.35*bandF+.65*roleF;
   raw=.35*br+.65*rawRole
 }

 return {
   factor:clamp(factor,.78,1.32),
   raw,
   roleSales:n,
   bandSales:same.length
 }
}

function scarcityFactor(p){
 let role=p.role,cfg=SCARCITY_CFG[role],band=roleBand(p),
     sold=soldSet(),
     cutoff=band*state.participants.length;

 // Comparabili = giocatori che appartengono alla stessa fascia o a una superiore.
 // È più robusto del vecchio confronto sul prezzo, che per outlier come Dimarco
 // poteva considerare "comparabile" solo Dimarco stesso.
 let comparable=PLAYERS.filter(q=>q.role===role&&Number(q.rank||999)<=cutoff),
     initial=Math.max(1,comparable.length),
     supply=comparable.filter(q=>!sold.has(q.id)).length,
     desired=band,
     demand=0;

 state.participants.forEach(team=>{
   if(missingRole(team.id,role)<=0)return;
   let ownedTop=activeTransactions()
     .filter(t=>Number(t.participantId)===Number(team.id))
     .map(t=>byId.get(t.playerId))
     .filter(q=>q?.role===role&&Number(q.rank||999)<=cutoff)
     .length;
   demand+=Math.max(0,desired-ownedTop)
 });

 let initialDemand=state.participants.length*desired,
     initialPressure=initialDemand/initial,
     pressure=demand/Math.max(1,supply),
     relative=pressure/Math.max(.0001,initialPressure),
     depletion=1-supply/initial;

 let delta=
   Math.max(0,relative-1)*cfg.coef+
   Math.max(0,depletion)*cfg.depletion;

 delta=clamp(delta,0,cfg.max);

 return {
   factor:1+delta,
   demand,supply,initial,
   pressure:relative,
   depletion
 }
}

function roleBudgetPressure(role){
 let idx=ROLE_ORDER.indexOf(role);
 if(idx<0)return {factor:1,ratio:1,available:0,planned:0,active:false};

 // Il carry ha senso solo quando i reparti precedenti sono stati completati.
 // Altrimenti il denaro non speso è ancora destinato a quei reparti, non è "risparmio".
 if(!priorRolesComplete(role))
   return {factor:1,ratio:1,available:0,planned:0,active:false};

 let futureShare=ROLE_ORDER.slice(idx+1)
   .reduce((s,r)=>s+Number(state.settings.shares[r]||0),0);

 let available=0,planned=0,activeTeams=0;
 state.participants.forEach(team=>{
   let miss=missingRole(team.id,role);
   if(miss<=0)return;
   activeTeams++;

   let cash=remaining(team.id),
       futureNominal=state.settings.budget*futureShare,
       canUseNow=Math.max(miss,cash-futureNominal),
       nominalLeft=Math.max(
         miss,
         state.settings.budget*state.settings.shares[role]-roleSpentBy(team.id,role)
       );

   available+=Math.max(0,canUseNow);
   planned+=Math.max(0,nominalLeft)
 });

 if(!activeTeams||planned<=0)
   return {factor:1,ratio:1,available,planned,active:true};

 let ratio=available/planned,
     factor=1+(ratio-1)*.42;

 return {
   factor:clamp(factor,.88,1.18),
   ratio,available,planned,active:true
 }
}

function dynamicAuctionMarket(p){
 let base=marketBaseline(p),
     inf=inflationFactor(p),
     scar=scarcityFactor(p),
     bud=roleBudgetPressure(p.role);

 // Segnali smorzati per evitare doppio conteggio e salti eccessivi.
 let factor=1+
   .72*(inf.factor-1)+
   .82*(scar.factor-1)+
   .55*(bud.factor-1);

 factor=clamp(factor,.76,1.45);

 return {
   base,
   live:Math.max(1,Math.round(base*factor)),
   factor,
   inflation:inf,
   scarcity:scar,
   budget:bud
 }
}

function fairPrice(p,s=scorePlayer(p),dm=dynamicAuctionMarket(p)){
 let m=dm.live,
     adj=clamp(.90+(s.quality-55)/260+(s.net>0?Math.min(.06,s.net/700):-.03),.86,1.15);
 return Math.max(1,Math.round(m*adj))
}

function targetStop(p,s=scorePlayer(p)){
 let i=intel(p),
     dm=dynamicAuctionMarket(p),
     alloc=allocationFactor(p.role),
     marketLive=dm.live,

     // Fair di mercato prima della strategia personale
     fairMarket=fairPrice(p,s,dm),

     // Le percentuali del TUO budget cambiano il prezzo consigliato,
     // non il prezzo che ci aspettiamo dagli altri.
     fair=Math.max(1,Math.round(fairMarket*alloc.factor)),
     target=Math.max(1,Math.round((.55*marketLive+.45*fairMarket)*alloc.factor));

 // Stop: parte dal cap statico, reagisce al mercato e anche
 // all'allocazione personale, ma in modo leggermente più prudente del Target.
 let staticCap=i.cap!==null
   ?Math.round(Number(i.cap)*state.settings.budget/500)
   :Math.round(Math.max(target,marketBaseline(p))*1.10);

 let capMarketAdjustment=1+.62*(dm.factor-1),
     capAllocationAdjustment=1+.78*(alloc.factor-1),
     cap=Math.max(
       target,
       Math.round(staticCap*
         clamp(capMarketAdjustment,.84,1.28)*
         clamp(capAllocationAdjustment,.78,1.28)
       )
     );

 let bargain=Math.max(1,Math.round(Math.min(fair,target)*.82));
 if(bargain>=target)bargain=Math.max(1,target-1);

 return {
   market:marketLive,
   staticMarket:dm.base,
   fairMarket,
   fair,
   bargain,
   target,
   cap,
   allocation:alloc,
   dynamics:dm
 }
}

function remaining(pid){return state.settings.budget-activeTransactions().filter(t=>Number(t.participantId)===Number(pid)).reduce((s,t)=>s+Number(t.price||0),0)}
function roleCount(pid,role){return activeTransactions().filter(t=>Number(t.participantId)===Number(pid)&&byId.get(t.playerId)?.role===role).length}

function opportunity(p){
 let s=scorePlayer(p),ts=targetStop(p,s),
     value=clamp((ts.fair/Math.max(1,ts.market))*50+45,0,100),
     staticScar=clamp(100*(1-p.rank/(state.settings.slots[p.role]*state.participants.length+1)),20,100),
     liveScar=clamp(50+250*(ts.dynamics.scarcity.factor-1),20,100),
     scarcity=.55*staticScar+.45*liveScar;
 return Math.round(.45*s.quality+.30*value+.15*scarcity+.10*(intel(p).titularity==='alta'?100:65))
}
function recommendation(p,current){
 let s=scorePlayer(p),ts=targetStop(p,s),risk=marketRisk(p);
 let zone=current<=ts.bargain?'AFFARE':current<=ts.target?'COMPRA':current<=ts.cap?'SOLO SE PRIORITÀ':'LASCIA';
 let decision=zone==='AFFARE'?'COMPRA':zone;
 if(risk.level==='ROSSO'){zone='LASCIA';decision='LASCIA'}
 let deal=clamp(Math.round(60+40*(ts.target-current)/Math.max(4,ts.target)),0,100);
 return {p,s,...ts,zone,decision,deal,risk,opp:opportunity(p)}
}
// Ripartizione intera: la somma torna sempre al totale, anche con percentuali decimali.
function splitCredits(total,roles,weights,minimums={}){
 total=Math.round(total);
 const result=Object.fromEntries(roles.map(r=>[r,0]));
 if(total<roles.reduce((s,r)=>s+(minimums[r]||0),0))return null;
 let pending=[...roles],pool=total;
 while(pending.length){
  let sum=pending.reduce((s,r)=>s+Math.max(0,Number(weights[r])||0),0);
  let quotas=Object.fromEntries(pending.map(r=>[r,pool*(sum?Math.max(0,Number(weights[r])||0)/sum:1/pending.length)]));
  let fixed=pending.filter(r=>quotas[r]<(minimums[r]||0));
  if(fixed.length){
   fixed.forEach(r=>{result[r]=minimums[r]||0;pool-=result[r]});
   pending=pending.filter(r=>!fixed.includes(r));continue
  }
  pending.forEach(r=>result[r]=Math.floor(quotas[r]));
  let remainder=pool-pending.reduce((s,r)=>s+result[r],0);
  [...pending].sort((a,b)=>(quotas[b]-result[b])-(quotas[a]-result[a])||ROLE_ORDER.indexOf(a)-ROLE_ORDER.indexOf(b)).slice(0,remainder).forEach(r=>result[r]++);
  break
 }
 return result
}
function baseRoleBudgets(){return splitCredits(state.settings.budget,ROLE_ORDER,state.settings.shares)}
function budgetPlanKey(){return JSON.stringify([state.settings.budget,...ROLE_ORDER.map(r=>state.settings.shares[r])])}
function activeBudgetPlan(pid=state.settings.meId){
 let plan=state.budgetPlans?.[pid];
 return plan&&plan.key===budgetPlanKey()&&ROLE_ORDER.every(r=>Number.isInteger(plan.amounts?.[r])&&plan.amounts[r]>=0)&&ROLE_ORDER.reduce((s,r)=>s+plan.amounts[r],0)===state.settings.budget?plan:null
}

function budgetOverview(){
 let pid=state.settings.meId,base=baseRoleBudgets();
 let rows=ROLE_ORDER.map(role=>{
  let spent=cleanNum(roleSpent(pid,role)),planned=roleBudget(role),missing=roleRemaining(pid,role);
  return {role,spent,planned,base:base[role],missing,count:roleCount(pid,role),left:cleanNum(planned-spent),complete:missing===0}
 });
 return {rows,cash:cleanNum(remaining(pid)),missing:rows.reduce((s,r)=>s+r.missing,0),closedBalance:cleanNum(rows.filter(r=>r.complete).reduce((s,r)=>s+r.left,0))}
}
function rebalanceProposal(){
 let overview=budgetOverview(),open=overview.rows.filter(r=>!r.complete);
 if(!open.length)return {...overview,open,error:'Rosa completa: i crediti rimasti restano disponibili per la riparazione.'};
 if(overview.cash<overview.missing)return {...overview,open,error:`Mancano ${overview.missing-overview.cash} crediti per coprire tutti gli slot a 1 credito. Correggi un acquisto o svincola un giocatore in riparazione.`};
 if(!Number.isInteger(overview.cash)||overview.rows.some(r=>!Number.isInteger(r.spent)))return {...overview,open,error:'Sono presenti prezzi decimali: correggili in Rose prima di ricalcolare il budget.'};
 let weights=Object.fromEntries(open.map(r=>[r.role,Math.max(0,r.left)]));
 if(!Object.values(weights).some(v=>v>0))weights=Object.fromEntries(open.map(r=>[r.role,state.settings.shares[r.role]]));
 let amounts=splitCredits(overview.cash,open.map(r=>r.role),weights,Object.fromEntries(open.map(r=>[r.role,r.missing])));
 return {...overview,open,amounts,error:''}
}

function rebalanceError(amounts,proposal){
 if(proposal.error)return proposal.error;
 for(let row of proposal.open){if(!Number.isInteger(amounts[row.role])||amounts[row.role]<row.missing)return `${ROLE_NAMES[row.role]}: assegna almeno ${row.missing} crediti interi per i ${row.missing} slot liberi.`}
 let total=proposal.open.reduce((s,r)=>s+amounts[r.role],0),diff=cleanNum(proposal.cash-total);
 return diff===0?'':diff>0?`Restano ${diff} crediti da distribuire.`:`Hai distribuito ${-diff} crediti in più del disponibile.`
}
function updateRebalancePreview(){
 let proposal=rebalanceProposal(),amounts=readRebalanceAmounts(),error=rebalanceError(amounts,proposal),box=document.getElementById('rebalanceStatus'),button=document.getElementById('applyRebalance');
 if(box){box.textContent=error||`Totale corretto: ${proposal.cash} crediti distribuiti.`;box.className=error?'bad':'good'}
 if(button)button.disabled=!!error;
 proposal.open.forEach(r=>{let el=document.getElementById('rebalanceDelta'+r.role),delta=cleanNum(amounts[r.role]-r.left);if(el)el.textContent=Number.isFinite(delta)?`Variazione: ${delta>0?'+':''}${delta} cr`:''});
 return !error
}

function rosterErrorFor(st,transactions,pid,reserve=true){
 const team=st.participants.find(t=>Number(t.id)===Number(pid));if(!team)return 'Squadra non valida.';
 const rows=transactions.filter(t=>t.active!==false&&Number(t.participantId)===Number(pid)),limit=Object.values(st.settings.slots).reduce((s,v)=>s+v,0);
 if(rows.some(t=>!byId.has(Number(t.playerId))||!Number.isInteger(t.price)||t.price<1))return `${team.name}: giocatore o prezzo non valido.`;
 if(rows.length>limit)return `${team.name}: rosa oltre il limite.`;
 for(const role of ROLE_ORDER)if(rows.filter(t=>byId.get(Number(t.playerId)).role===role).length>st.settings.slots[role])return `${team.name}: reparto ${role} pieno.`;
 const spent=rows.reduce((s,t)=>s+t.price,0),missing=Math.max(0,limit-rows.length),left=st.settings.budget-spent;
 if(left<0)return `${team.name}: budget superato di ${-left} cr.`;
 if(reserve&&left<missing)return `${team.name}: servono almeno ${missing} cr per gli altri ${missing} slot; ne resterebbero ${left}.`;
 return ''
}
function maxBidFor(pid,role){
 if(!state.participants.some(t=>Number(t.id)===Number(pid))||!canAssignRole(pid,role))return 0;
 return Math.max(0,Math.floor(remaining(pid)-Math.max(0,totalRosterLimit()-totalRosterCount(pid)-1)))
}
function bidLimits(p){
 const entry=personalEntry(p.id),sold=soldSet().has(p.id),missing=roleRemaining(state.settings.meId,p.role);
 const actual=sold?0:maxBidFor(state.settings.meId,p.role),department=Math.max(0,Math.floor(roleBudget(p.role)-roleSpent(state.settings.meId,p.role)-Math.max(0,missing-1)));
 const rec=recommendation(p,price),personal=entry?.maxPrice>0?entry.maxPrice:Infinity;
 const stop=entry?.status==='avoid'||rec.risk.level==='ROSSO'?0:Math.min(rec.cap,actual,department,personal);
 return {actual,department:Math.min(actual,department),stop,target:rec.target,personal,sold}
}
function bidLimitsHtml(p){
 const b=bidLimits(p),outside=price>b.actual,entry=personalEntry(p.id);
 return `<div class="bidlimits"><div class="bidmetrics">${metric('Prezzo consigliato',b.target+' cr')}${metric('Limite reparto',b.department+' cr')}${metric('Massimo spendibile',b.actual+' cr')}</div><div class="bidstop ${outside||b.stop===0?'bad':''}">${b.sold?'Giocatore già assegnato':b.stop===0?'Non rilanciare per la tua squadra':`Il tuo stop operativo: ${b.stop} cr`}</div><div class="muted">Il limite reparto conserva 1 cr per ogni altro posto nel reparto. Il massimo spendibile conserva 1 cr per ogni altro posto della rosa.${Number.isFinite(b.personal)?` Limite personale: ${b.personal} cr.`:''}</div>${!b.sold&&outside?'<div class="bad">Questo prezzo impedirebbe di completare la tua rosa.</div>':!b.sold&&price>b.department?'<div class="warn">Stai sforando il piano del reparto. Dopo l’acquisto puoi ricalcolare il budget.</div>':''}${entry?.status==='avoid'?'<div class="bad">Hai segnato questo giocatore come “Da evitare”.</div>':''}</div>`
}

function handleLiveSearchKey(e){
 if(e.isComposing||!['ArrowDown','ArrowUp','Enter'].includes(e.key))return;
 if(selectedId&&e.key==='Enter'){e.preventDefault();focusField('price',true);return}
 const list=liveCandidates();if(!list.length)return;e.preventDefault();
 if(e.key==='Enter'){if(!e.repeat)choose(list[liveResultIndex]?.id||list[0].id);return}
 liveResultIndex=(liveResultIndex+(e.key==='ArrowDown'?1:-1)+list.length)%list.length;renderResults();
 document.getElementById('liveResult'+list[liveResultIndex].id)?.scrollIntoView?.({block:'nearest'})
}

function rankedRows(role,searchText='',importsOnly=false,includeSold=false){
 let sold=includeSold?null:soldSet();
 return PLAYERS.filter(p=>p.role===role&&(includeSold||!sold.has(p.id)))
  .filter(passTitularityFilter)
  .filter(p=>!norm(searchText)||norm(p.name+' '+p.team).includes(norm(searchText)))
  .filter(p=>!importsOnly||importSet.has(norm(p.name)))
  .map(p=>{let s=scorePlayer(p),t=targetStop(p,s);return {p,s,t,opp:opportunity(p)}})
}
function listRows(section){
 let rows=rankedRows(state.settings.role,listQueries[section],section==='scout'&&filterImport,section==='scout');
 if(section==='ranking')return rows.sort((a,b)=>b.opp-a.opp||b.s.quality-a.s.quality).slice(0,80);
 return rows.sort((a,b)=>{
  if(sortScout==='bonus')return b.s.bonus-a.s.bonus;
  if(sortScout==='xfm')return b.s.xfm-a.s.xfm;
  if(sortScout==='fair')return b.t.fair-a.t.fair;
  if(sortScout==='target')return b.t.target-a.t.target;
  return b.s.quality-a.s.quality
 })
}

function validBackupId(value){return (typeof value==='string'||typeof value==='number')&&/^[A-Za-z0-9_-]{1,100}$/.test(String(value))}
function validateBackupState(raw,label,warnings){
 const fail=message=>{throw new Error(label+': '+message)},plain=x=>x&&typeof x==='object'&&!Array.isArray(x);
 if(!plain(raw)||!Array.isArray(raw.participants)||raw.participants.length<2||raw.participants.length>20)fail('servono da 2 a 20 squadre.');
 const ids=new Set();
 for(const t of raw.participants){if(!plain(t)||!Number.isSafeInteger(t.id)||t.id<1||ids.has(t.id))fail('ID delle squadre non validi o duplicati.');ids.add(t.id);if(typeof t.name!=='string'||!t.name.trim()||t.name.length>200)fail('nome squadra non valido.');if(t.name.length>NAME_MAX_LENGTH)warnings.push(`${label}: il nome di una squadra supera 25 caratteri; potrai accorciarlo nelle impostazioni.`)}
 if(!plain(raw.settings))fail('impostazioni mancanti.');
 const settings={...defaultState().settings,...raw.settings,slots:{...defaultState().settings.slots,...raw.settings.slots},shares:{...DEFAULT_SHARES,...raw.settings.shares},rules:{...DEFAULT_RULES,...raw.settings.rules}};
 if(!Number.isInteger(settings.budget)||settings.budget<100||settings.budget>5000)fail('budget fuori intervallo (100–5000).');
 if(!ids.has(settings.meId)||!ROLE_ORDER.includes(settings.role))fail('squadra personale o reparto corrente non validi.');
 if(ROLE_ORDER.some(r=>!Number.isInteger(settings.slots[r])||settings.slots[r]<1||settings.slots[r]>30)||ROLE_ORDER.reduce((s,r)=>s+settings.slots[r],0)>60)fail('composizione rosa non valida.');
 if(ROLE_ORDER.some(r=>!Number.isFinite(settings.shares[r])||settings.shares[r]<0||settings.shares[r]>1)||Math.abs(ROLE_ORDER.reduce((s,r)=>s+settings.shares[r],0)-1)>.000011)fail('percentuali reparto non valide.');
 if(RULE_FIELDS.some(([key,,min,max])=>!Number.isFinite(settings.rules[key])||settings.rules[key]<min||settings.rules[key]>max)||!Number.isInteger(settings.rules.minRaise)||settings.rules.minRaise<1||settings.rules.minRaise>50||typeof settings.rules.defenseModifier!=='boolean'||typeof settings.rules.tradesAllowed!=='boolean')fail('regole non valide.');
 if(!['initial','repair'].includes(settings.auctionMode)||typeof settings.fastMode!=='boolean')fail('modalità asta non valida.');
 if(!Array.isArray(raw.transactions)||raw.transactions.length>50000)fail('elenco acquisti mancante o troppo grande.');
 const transactionIds=new Set(),activePlayers=new Set();
 for(const t of raw.transactions){
  if(!plain(t)||!validBackupId(t.id)||transactionIds.has(String(t.id)))fail('ID acquisti non validi o duplicati.');transactionIds.add(String(t.id));
  if(!Number.isInteger(t.playerId)||!byId.has(t.playerId))fail(`giocatore ${t.playerId} non presente nel listone di questa app.`);
  if(!Number.isInteger(t.price)||t.price<1||t.price>5000||!Number.isInteger(t.participantId)||(t.active!==undefined&&typeof t.active!=='boolean'))fail('prezzo o proprietario non valido.');
  if(t.active!==false){if(!ids.has(t.participantId))fail('acquisto assegnato a una squadra inesistente.');if(activePlayers.has(t.playerId))fail('un giocatore risulta assegnato più volte.');activePlayers.add(t.playerId)}
  if(t.sessionId!==undefined&&!validBackupId(t.sessionId))fail('ID sessione non valido.')
 }
 if(raw.sessions!==undefined&&(!Array.isArray(raw.sessions)||raw.sessions.length>10000||raw.sessions.some(x=>!plain(x)||!validBackupId(x.id)||!['initial','repair'].includes(x.type)||typeof x.name!=='string'||x.name.length>200)||new Set(raw.sessions.map(x=>String(x.id))).size!==raw.sessions.length))fail('sessioni non valide.');
 const st=normalizeState(cloneState({...raw,settings}));
 if(raw.currentSessionId&&!st.sessions.some(x=>x.id===raw.currentSessionId))fail('sessione corrente non trovata.');
 if(st.transactions.some(t=>!st.sessions.some(s=>s.id===t.sessionId)))fail('un acquisto fa riferimento a una sessione inesistente.');
 for(const team of st.participants){let error=rosterErrorFor(st,st.transactions,team.id,false);if(error)fail(error);error=rosterErrorFor(st,st.transactions,team.id,true);if(error)warnings.push(label+': '+error+' Correggi gli acquisti prima di continuare.')}
 if(raw.unsold!==undefined&&(!Array.isArray(raw.unsold)||raw.unsold.some(id=>!Number.isInteger(id)||!byId.has(id))))fail('elenco invenduti non valido.');
 if(raw.repairLog!==undefined&&!Array.isArray(raw.repairLog))fail('registro riparazioni non valido.');
 if(raw.shortlists!==undefined&&!plain(raw.shortlists))fail('liste personali non valide.');
 for(const [pid,list] of Object.entries(st.shortlists)){
  if(!/^\d+$/.test(pid)||!plain(list))fail('lista personale non valida.');
  for(const [id,entry] of Object.entries(list))if(!/^\d+$/.test(id)||!byId.has(Number(id))||!plain(entry)||!Object.hasOwn(PERSONAL_STATUSES,entry.status)||!Number.isInteger(entry.maxPrice)||entry.maxPrice<0||entry.maxPrice>5000||typeof entry.note!=='string'||entry.note.length>NOTE_MAX_LENGTH)fail('obiettivo personale non valido.')
 }
 if(raw.budgetPlans!==undefined&&!plain(raw.budgetPlans))fail('piani budget non validi.');
 for(const [pid,plan] of Object.entries(st.budgetPlans))if(!/^\d+$/.test(pid)||!plain(plan)||typeof plan.key!=='string'||plan.key.length>500||!plain(plan.amounts)||ROLE_ORDER.some(r=>!Number.isInteger(plan.amounts[r])||plan.amounts[r]<0)||ROLE_ORDER.reduce((s,r)=>s+plan.amounts[r],0)!==settings.budget)fail('piano budget non valido.');
 return st
}
function parseBackupText(text){
 if(typeof text!=='string'||text.length>10*1024*1024)throw new Error('Il backup supera il limite di 10 MB.');
 let raw;try{raw=JSON.parse(text,(key,value)=>{if(['__proto__','prototype','constructor'].includes(key))throw new Error('Chiave non consentita');return value})}catch(e){throw new Error('File JSON non valido o struttura non consentita.')}
 if(raw?.app!==undefined){if(raw.app!=='FantaCalcio Copilot'||raw.schemaVersion!==1)throw new Error('Formato o versione del backup non supportati.');raw=raw.store}
 if(raw&&Array.isArray(raw.participants)&&Array.isArray(raw.transactions)&&raw.settings)raw={activeId:'legacy-import',auctions:[{id:'legacy-import',name:'Asta importata',state:raw}]};
 if(!raw||!Array.isArray(raw.auctions)||!raw.auctions.length||raw.auctions.length>100)throw new Error('Il file non contiene un backup valido delle aste (massimo 100 aste).');
 const warnings=[],ids=new Set(),now=new Date().toISOString();
 const auctions=raw.auctions.map((a,i)=>{
  if(!a||!validBackupId(a.id)||ids.has(String(a.id)))throw new Error('ID delle aste non validi o duplicati.');ids.add(String(a.id));
  if(typeof a.name!=='string'||!a.name.trim()||a.name.length>200)throw new Error('Nome asta non valido.');
  if(a.name.length>NAME_MAX_LENGTH)warnings.push(`Asta ${i+1}: nome storico oltre 25 caratteri, mantenuto integralmente.`);
  return {id:String(a.id),name:a.name,createdAt:typeof a.createdAt==='string'?a.createdAt:now,updatedAt:typeof a.updatedAt==='string'?a.updatedAt:now,state:validateBackupState(a.state,`Asta ${i+1}`,warnings)}
 });
 if(raw.activeId!==undefined&&!ids.has(String(raw.activeId)))throw new Error('L’asta attiva indicata nel backup non esiste.');
 return {store:{activeId:String(raw.activeId??auctions[0].id),auctions},warnings}
}
function openBackupImport(){pendingImport=null;openModal('backupImport')}
async function readBackupFile(file){
 if(!file)return;const modal=modalState,box=document.getElementById('modalError');pendingImport=null;
 if(file.size>10*1024*1024){if(box)box.textContent='Il file supera 10 MB.';return}
 if(box)box.textContent='Controllo del backup…';
 try{const text=await file.text();if(modalState!==modal)return;pendingImport={...parseBackupText(text),filename:file.name};openModal('backupPreview',{mode:'merge'})}
 catch(e){if(modalState===modal&&box)box.textContent=e.message||'Impossibile leggere il file.'}
}
function recoveryAvailable(){try{return !!localStorage.getItem(RECOVERY_STORAGE_KEY)}catch(e){return false}}
function openImportRecovery(){try{const text=localStorage.getItem(RECOVERY_STORAGE_KEY);if(!text)throw new Error('Nessuna copia di recupero disponibile.');pendingImport={...parseBackupText(text),filename:'Copia precedente all’ultima importazione'};openModal('backupPreview',{mode:'replace'})}catch(e){notice=e.message;render()}}
function changeImportMode(mode){if(!['merge','replace'].includes(mode))return;modalState.data.mode=mode;render()}
function confirmBackupImport(){
 if(!pendingImport||modalState?.type!=='backupPreview')return;
 const mode=modalState.data.mode,box=document.getElementById('modalError');
 if(mode==='replace'&&!document.getElementById('confirmReplaceBackup')?.checked){if(box)box.textContent='Conferma la sostituzione delle aste presenti.';return}
 let candidate=cloneState(pendingImport.store);
 if(mode==='merge'){

  if(current.auctions.length+imported.length>100){if(box)box.textContent='L’importazione supererebbe il limite di 100 aste.';return}
  const names=new Set(current.auctions.map(a=>a.name));
  imported.forEach(a=>{if(names.has(a.name)){const suffix=' - importata';a.name=a.name.slice(0,NAME_MAX_LENGTH-suffix.length).replace(/[\uD800-\uDBFF]$/,'').trimEnd()+suffix}names.add(a.name)});
  candidate={activeId:imported[0].id,auctions:[...current.auctions,...imported]}
 }
 try{parseBackupText(JSON.stringify(candidate))}catch(e){if(box)box.textContent=e.message;return}
 if(!persistStoreCandidate(candidate,true)){if(box)box.textContent=storageError;return}
 pendingImport=null;modalState=null;tab='settings';notice=mode==='merge'?'Backup aggiunto come nuove aste. Le aste precedenti sono state conservate.':'Backup ripristinato. La situazione precedente è recuperabile da Impostazioni.';render()

function openSetupWizard(mode='edit'){

 openModal('setupWizard',{mode,targetId:auctionStore.activeId,step:0,draft:{name:mode==='new'?'Nuova asta':activeAuction().name,count:source.participants.length,budget:source.settings.budget,participants:cloneState(source.participants),meId:source.settings.meId,slots:{...source.settings.slots},shares:{...source.settings.shares},rules:{...DEFAULT_RULES,...source.settings.rules}}})
}
function collectWizardStep(validate=true){
 const d=modalState.data.draft,step=modalState.data.step;
 const value=id=>document.getElementById(id)?.value;
 if(step===0){
  d.name=String(value('wizardName')||'').trim();d.count=Number(value('wizardCount'));d.budget=Number(value('wizardBudget'));
  if(!d.name||d.name.length>NAME_MAX_LENGTH)return 'Il nome asta deve contenere da 1 a 25 caratteri.';
  if(!Number.isInteger(d.count)||d.count<2||d.count>20)return 'Scegli da 2 a 20 squadre.';
  if(!Number.isInteger(d.budget)||d.budget<100||d.budget>5000)return 'Il budget deve essere un numero intero tra 100 e 5000.';
  let maxId=Math.max(0,...d.participants.map(t=>t.id));d.participants=d.participants.slice(0,d.count);
  while(d.participants.length<d.count){maxId++;d.participants.push({id:maxId,name:`Squadra ${maxId}`})}
  if(!d.participants.some(t=>t.id===d.meId))d.meId=d.participants[0].id
 }else if(step===1){
  d.participants=d.participants.map(t=>({...t,name:String(value('wizardTeam'+t.id)||'').trim()}));
  d.meId=Number(document.querySelector('input[name="wizardMe"]:checked')?.value);
  if(d.participants.some(t=>!t.name||t.name.length>NAME_MAX_LENGTH))return 'Ogni squadra deve avere un nome da 1 a 25 caratteri.';
  if(new Set(d.participants.map(t=>t.name.toLocaleLowerCase('it'))).size!==d.participants.length)return 'Usa nomi diversi per riconoscere tutte le squadre.';
  if(!d.participants.some(t=>t.id===d.meId))return 'Seleziona la tua squadra.'
 }else if(step===2){
  for(const r of ROLE_ORDER){d.slots[r]=Number(value('wizardSlot'+r));d.shares[r]=cleanNum(Number(value('wizardShare'+r))/100)}
  if(ROLE_ORDER.some(r=>!Number.isInteger(d.slots[r])||d.slots[r]<1||d.slots[r]>30)||Object.values(d.slots).reduce((s,v)=>s+v,0)>60)return 'Imposta da 1 a 30 posti per reparto, massimo 60 giocatori in rosa.';
  if(ROLE_ORDER.some(r=>!Number.isFinite(d.shares[r])||d.shares[r]<0||d.shares[r]>1)||Math.abs(Object.values(d.shares).reduce((s,v)=>s+v,0)-1)>.000011)return 'Le percentuali devono essere tra 0 e 100 e sommare 100%.';
  for(const r of ROLE_ORDER)if(d.slots[r]*d.count>rolePeers[r].length)return `Nel listone ci sono ${rolePeers[r].length} giocatori ${r}: non bastano per ${d.count} squadre con ${d.slots[r]} posti ciascuna.`
 }else if(step===3){
  for(const [key] of RULE_FIELDS)d.rules[key]=Number(value('wizardRule'+key));
  d.rules.minRaise=Number(value('wizardMinRaise'));d.rules.defenseModifier=!!document.getElementById('wizardModifier')?.checked;d.rules.tradesAllowed=!!document.getElementById('wizardTrades')?.checked;
  if(RULE_FIELDS.some(([key,,min,max])=>!Number.isFinite(d.rules[key])||d.rules[key]<min||d.rules[key]>max))return 'Controlla bonus e malus: i valori devono rispettare gli intervalli indicati.';
  if(!Number.isInteger(d.rules.minRaise)||d.rules.minRaise<1||d.rules.minRaise>50)return 'Il rilancio deve essere un numero intero tra 1 e 50.'
 }
 return ''
}

function buildWizardState(data){
 const d=data.draft,base=data.mode==='new'?defaultState():cloneState(state);
 base.participants=cloneState(d.participants);base.settings={...base.settings,budget:d.budget,meId:d.meId,slots:{...d.slots},shares:{...d.shares},rules:{...d.rules}};
 if(data.mode==='new'||JSON.stringify([state.settings.budget,state.settings.slots,state.settings.shares])!==JSON.stringify([d.budget,d.slots,d.shares]))base.budgetPlans={};
 base.setupComplete=true;return normalizeState(base)
}
function applySetupWizard(){
 if(modalState?.type!=='setupWizard'||modalState.data.step!==4)return;
 const data=modalState.data,d=data.draft,box=document.getElementById('modalError');
 if(data.targetId!==auctionStore.activeId){box.textContent='L’asta attiva è cambiata: riapri la configurazione.';return}
 if(d.name.length<1||d.name.length>NAME_MAX_LENGTH){box.textContent='Nome asta non valido.';return}
 const next=buildWizardState(data),ids=new Set(next.participants.map(t=>t.id));
 if(next.transactions.some(t=>t.active!==false&&!ids.has(t.participantId))){box.textContent='Una squadra che vuoi eliminare ha ancora giocatori. Spostali o svincolali prima.';return}
 for(const team of next.participants){const error=rosterErrorFor(next,next.transactions,team.id);if(error){box.textContent=error;return}}
 try{validateBackupState(next,'Configurazione',[])}catch(e){box.textContent=e.message;return}
 const candidate=currentStoreSnapshot(),now=new Date().toISOString();
 if(data.mode==='new'){
  if(candidate.auctions.length>=100){box.textContent='Hai raggiunto il limite di 100 aste.';return}
  const id=newAuctionId();candidate.auctions.push({id,name:d.name,createdAt:now,updatedAt:now,state:next});candidate.activeId=id
 }else{const a=candidate.auctions.find(a=>a.id===candidate.activeId);a.name=d.name;a.state=next;a.updatedAt=now}
 if(!persistStoreCandidate(candidate)){box.textContent=storageError;return}
 modalState=null;tab='live';notice=`Lega configurata. La tua squadra è ${state.participants.find(t=>t.id===state.settings.meId).name}.`;render()
}

function render(){
 let out=header()+budgetDashboard();
 if(!state.setupComplete)out+='<div class="notice"><b>Completa la configurazione della lega.</b> <button class="small" onclick="openSetupWizard()">INIZIA CONFIGURAZIONE</button></div>';
 if(storageError)out+=`<div class="notice bad" role="alert">${esc(storageError)}</div>`;
 if(notice&&tab!=='live')out+=`<div class="notice" role="status">${esc(notice)}</div>`;
 if(tab==='live')out+=liveView();
 else if(tab==='ranking')out+=rankingView();
 else if(tab==='scout')out+=scoutView();
 else if(tab==='shortlist')out+=shortlistView();
 else if(tab==='rose')out+=roseView();
 else out+=settingsView();
 out+=modalHtml();
 document.getElementById('app').innerHTML=out
}
document.addEventListener('keydown',e=>{
 if(e.isComposing)return;
 if(modalState){if(e.key==='Escape'){e.preventDefault();closeModal()}return}
 const editing=e.target?.matches?.('input,textarea,select,[contenteditable="true"]');
 if(e.key==='/'&&!editing){e.preventDefault();focusField(tab==='ranking'?'rankingSearch':tab==='scout'?'scoutSearch':tab==='shortlist'?'shortlistSearch':'search',true);return}
 if(tab!=='live'||!state.settings.fastMode)return;
 if(e.key==='Escape'){e.preventDefault();selectedId=null;query='';price=1;render();focusField('search');return}
 if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!e.repeat&&selectedId&&['price','buyerSelect'].includes(e.target?.id)){e.preventDefault();assign()}
});
(function boot(){
 // Useful for real end-to-end browser verification, harmless in normal use.
 let q=new URLSearchParams(location.search),name=q.get('player');
 if(name){let p=PLAYERS.find(x=>norm(x.name)===norm(name));if(p){selectedId=p.id;state.settings.role=p.role;query=p.name;tab='live'}}
 if(!state.setupComplete&&!state.transactions.length&&!name)openSetupWizard();else render()
})();
</script></body></html>
