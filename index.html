const DEFAULT_SHARES={P:.10,D:.20,C:.30,A:.40};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const byId=new Map(PLAYERS.map(p=>[p.id,p]));
const intelMap=Object.fromEntries(Object.entries(INTEL_DATA.players||{}).map(([k,v])=>[norm(k),v]));
const importSet=new Set(FOREIGN_IMPORT_NAMES.map(norm));
const rolePeers=Object.fromEntries(['P','D','C','A'].map(r=>[r,PLAYERS.filter(p=>p.role===r)]));
let TEAM_STRENGTH=null;

function defaultState(){
 return {
  participants:Array.from({length:10},(_,i)=>({id:i+1,name:i===0?'IO':`Avv ${i+1}`})),
  transactions:[],unsold:[],
  settings:{budget:500,meId:1,role:'P',slots:{P:3,D:8,C:8,A:6},shares:{...DEFAULT_SHARES}},
  migratedFromLegacy:false
 }
}
function loadState(){
 try{
  let n=localStorage.getItem(STORAGE_KEY);
  if(n)return normalizeState(JSON.parse(n));
  let old=JSON.parse(localStorage.getItem(OLD_STORAGE_KEY)||'null');
  if(old){
   let s=defaultState();
   if(Array.isArray(old.participants)&&old.participants.length)s.participants=old.participants;
   if(Array.isArray(old.transactions))s.transactions=old.transactions;
   if(Array.isArray(old.unsold))s.unsold=old.unsold;
   if(old.settings){
    s.settings.budget=Number(old.settings.initialBudget||old.settings.budget||500);
    s.settings.meId=Number(old.settings.meId||1);
    s.settings.role=old.settings.currentRole||'P';
    s.settings.slots={...s.settings.slots,...(old.settings.slots||{})};
   }
   // Deliberately DO NOT migrate overrides or old role shares.
   s.migratedFromLegacy=true;
   localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
   return s;
  }
 }catch(e){}
 return defaultState()
}
function normalizeState(s){
 let d=defaultState();s=s||d;
 s.participants=Array.isArray(s.participants)&&s.participants.length?s.participants:d.participants;
 s.transactions=Array.isArray(s.transactions)?s.transactions:[];
 s.unsold=Array.isArray(s.unsold)?s.unsold:[];
 s.settings={...d.settings,...(s.settings||{})};
 s.settings.slots={...d.settings.slots,...(s.settings?.slots||{})};
 s.settings.shares={...DEFAULT_SHARES,...(s.settings?.shares||{})};
 return s
}
let state=loadState();
let tab='live',selectedId=null,query='',price=1,buyerId=state.settings.meId,notice='',sortScout='quality',filterImport=false,titFilter='all';
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function intel(p){
 let x=intelMap[norm(p.name)]||{};
 return {
  tier:x.tier||'BASE',target:x.target??null,cap:x.cap??null,
  titularity:x.titularity||inferTitularity(p),
  penalty:x.penalty||'no',mod:x.mod||'neutro',captain:Number(x.captain||0),
  volatility:x.volatility||'media',note:x.note||''
 }
}
function inferTitularity(p){
 let pct=rankPct(p);return pct>.72?'alta':pct>.35?'media':'bassa'
}
function rankPct(p){
 let a=rolePeers[p.role],n=Math.max(2,a.length);return clamp(1-(Math.max(1,p.rank)-1)/(n-1),0,1)
}

function physicalInfo(p){
 let d=PHYSICAL_DATA[String(p.id)]||{};
 let grade=String(d.grade||'B').toUpperCase();
 let score=Number(d.score||60);
 let confidence=String(d.confidence||'BASSA').toUpperCase();
 let estimated=!!d.estimated;
 let status=String(d.status||'Nessuna nota specifica disponibile.');
 let source=String(d.source||'database interno');
 return {grade,score,confidence,estimated,status,source}
}
function physicalLabel(p){
 let x=physicalInfo(p);
 return `${x.grade}${x.estimated?'*':''}`
}
function expectedApps(p,i){
 let base=i.titularity==='alta'?32:i.titularity==='bassa'?16:24;
 let h=FANTASY_HISTORY[p.name];
 if(h&&Number(h.pv)>=30&&i.titularity==='alta')base=33;
 let ph=PHYSICAL_DATA[String(p.id)];
 if(ph&&!ph.estimated){
  if(ph.grade==='D')base=Math.round(base*.75);
  else if(ph.grade==='C')base=Math.round(base*.88);
 }
 return clamp(base,8,36)
}
function teamStrength(team){
 if(!TEAM_STRENGTH){
  let by={};PLAYERS.forEach(p=>(by[p.team]??=[]).push(Number(p.fvm||0)));
  let sums={};Object.entries(by).forEach(([t,a])=>sums[t]=a.sort((x,y)=>y-x).slice(0,14).reduce((s,x)=>s+x,0));
  let vals=Object.values(sums).sort((a,b)=>a-b),med=vals[Math.floor(vals.length/2)]||1;
  TEAM_STRENGTH={};Object.entries(sums).forEach(([t,v])=>TEAM_STRENGTH[t]=clamp(Math.pow(v/med,.16),.90,1.10));
 }
 return TEAM_STRENGTH[team]||1
}
function importContext(p){
 let c=IMPORT_CONTEXT_DATA[norm(p.name)]||null;
 if(!c)return {factor:teamStrength(p.team),label:'contesto neutrale'};
 let league=Number(c.leagueFactor||1),source=Number(c.sourceTeamFactor||1),dest=teamStrength(p.team);
 let factor=clamp((1+.45*(league-1))*(1-.20*(source-1))*(1+.45*(dest-1)),.84,1.16);
 return {factor,label:`${c.league||'estero'} · ${c.sourceTeam||'?'} → ${p.team}`}
}
function positionalPrior(p){
 let rm=String(p.rm||''),pct=rankPct(p),q=.85+.30*pct,g=0,a=0,yc=0;
 if(p.role==='D'){
  if(/[EW]/.test(rm)){g=.10;a=.14}else if(/Dd|Ds/.test(rm)){g=.065;a=.085}else{g=.075;a=.045}
  yc=/Dc/.test(rm)?.16:.13;
 }else if(p.role==='C'){
  if(/[WA]/.test(rm)){g=.18;a=.14}else if(/T/.test(rm)){g=.16;a=.15}else if(/C/.test(rm)){g=.12;a=.10}else{g=.10;a=.09}
  yc=/[MC]/.test(rm)?.15:.11;
 }else if(p.role==='A'){
  if(/Pc/.test(rm)){g=.34;a=.10}else{g=.27;a=.17}
  yc=.08;
 }
 return {g:g*q,a:a*q,yc}
}
function provenOutlier(p,h,prior){
 if(!h||Number(h.pv)<28||p.role==='P')return false;
 let hist=(3*Number(h.g||0)+1.05*Number(h.a||0))/Math.max(1,Number(h.pv));
 let generic=3*prior.g+1.05*prior.a;
 let rm=String(p.rm||'');
 let roleFit=p.role==='D'?/[EW]/.test(rm):p.role==='C'?/[WAT]/.test(rm):true;
 return roleFit&&hist>generic*1.55
}
function eventProjection(p){
 let i=intel(p),apps=expectedApps(p,i),pct=rankPct(p);
 if(p.role==='P'){
  let strength=teamStrength(p.team),cs=apps*(.23+.17*pct)*strength,gc=apps*(1.45-.45*pct)/strength,
      saves=(.35+.35*pct)*(apps/32),bonus=cs+3*saves,malus=gc;
  return {apps,goals:0,assists:0,yc:0,rc:0,penMiss:0,bonus:r1(bonus),malus:r1(malus),net:r1(bonus-malus),source:'PRIOR PORTIERE',profile:'Portiere',historyWeight:0}
 }
 let prior=positionalPrior(p),h=FANTASY_HISTORY[p.name]||null,ctx=importSet.has(norm(p.name))?importContext(p):{factor:1,label:''};
 let priorG=prior.g*apps*ctx.factor,priorA=prior.a*apps*ctx.factor;
 let goals=priorG,assists=priorA,hw=0;
 if(h&&Number(h.pv)>=6){
  let hp=Number(h.pv),sample=clamp((hp-6)/29,0,1);
  hw=.45+.27*sample;
  if(provenOutlier(p,h,prior))hw=Math.max(hw,.84);
  hw=clamp(hw,.45,.86);
  let hg=Number(h.g||0)/hp*apps,ha=Number(h.a||0)/hp*apps;
  goals=hw*hg+(1-hw)*priorG;
  assists=hw*ha+(1-hw)*priorA;
 }
 // Penalties are NEVER stacked onto observed goals when history exists.
 // Only no-history players receive an explicit penalty-event prior.
 let penMiss=0;
 if(!h&&i.penalty!=='no'){
  let attempts=(i.penalty==='si'?2.8:1.1)*(apps/32),conv=.79;
  goals+=attempts*conv;penMiss=attempts*(1-conv)
 }else if(h&&i.penalty!=='no'){
  let attempts=(i.penalty==='si'?2.0:.8)*(apps/32);
  if(h.penAttempts!==undefined)attempts=.7*attempts+.3*(Number(h.penAttempts||0)/Math.max(1,Number(h.pv))*apps);
  penMiss=attempts*.18
 }
 let yc,rc;
 if(h&&h.yc!==undefined){
  yc=Number(h.yc||0)/Math.max(1,Number(h.pv))*apps;
  rc=Number(h.rc||0)/Math.max(1,Number(h.pv))*apps*.75
 }else{
  yc=prior.yc*apps;rc=.006*apps
 }
 let bonus=3*goals+1.05*assists;
 if(h&&provenOutlier(p,h,prior)){
  let direct=(3*Number(h.g||0)+1.05*Number(h.a||0))/Math.max(1,Number(h.pv))*apps;
  bonus=Math.max(bonus,direct*.93)
 }
 let malus=.5*yc+rc+3*penMiss;
 return {
  apps,goals:r1(goals),assists:r1(assists),yc:r1(yc),rc:r1(rc),penMiss:r1(penMiss),
  bonus:r1(bonus),malus:r1(malus),net:r1(bonus-malus),
  source:h?'STORICO FANTACALCIO + PRIOR':'PRIOR RUOLO'+(importSet.has(norm(p.name))?' + CONTESTO ESTERO':''),
  profile:profileLabel(p,i,h,prior),historyWeight:Math.round(hw*100),context:ctx.label
 }
}
function profileLabel(p,i,h,prior){
 let rm=String(p.rm||''),t=[];
 if(p.role==='D')t.push(/[EW]/.test(rm)?'Esterno offensivo':/Dd|Ds/.test(rm)?'Terzino':'Centrale');
 if(p.role==='C')t.push(/[WA]/.test(rm)?'Ala/sottopunta':/T/.test(rm)?'Trequartista':'Centrocampista');
 if(p.role==='A')t.push(/Pc/.test(rm)?'Centravanti':'Seconda punta/ala');
 if(h&&provenOutlier(p,h,prior))t.push('outlier confermato');
 if(i.penalty==='si')t.push('rigorista');
 return t.join(' · ')
}
function r1(x){return Math.round(Number(x||0)*10)/10}
function baseMV(p){
 let h=FANTASY_HISTORY[p.name],pct=rankPct(p),generic={P:5.95,D:5.95,C:5.95,A:5.92}[p.role]+.32*pct;
 return h&&h.mv!==undefined?r1(.84*Number(h.mv)+.16*generic):r1(generic)
}
function scorePlayer(p){
 let ev=eventProjection(p),mv=baseMV(p),xfm=mv+ev.net/Math.max(8,ev.apps);
 let ranges={P:[4.6,6.5],D:[5.5,7.7],C:[5.5,8.0],A:[5.5,8.8]}[p.role];
 let xScore=clamp((xfm-ranges[0])/(ranges[1]-ranges[0])*100,0,100);
 let netRanges={P:[-35,-8],D:[0,35],C:[2,45],A:[8,65]}[p.role];
 let nScore=clamp((ev.net-netRanges[0])/(netRanges[1]-netRanges[0])*100,0,100);
 let quality=Math.round(.42*(rankPct(p)*100)+.33*xScore+.20*nScore+.05*(intel(p).titularity==='alta'?100:intel(p).titularity==='media'?65:30));
 return {quality,xfm:r1(xfm),...ev,mv}
}
function rankCurve(p){
 let c=CURVES_500[p.role]||[],i=Math.max(0,Math.floor(Number(p.rank||1))-1);return Number(c[i]??1)
}
function fvm500(p){return Math.max(1,Math.round(Number(p.fvm||0)/2))}
function marketBaseline(p){
 let i=intel(p);
 if(i.target!==null)return Math.round(Number(i.target)*state.settings.budget/500);
 return Math.max(1,Math.round((.72*rankCurve(p)+.28*fvm500(p))*state.settings.budget/500))
}
function fairPrice(p,s=scorePlayer(p)){
 let m=marketBaseline(p),adj=clamp(.90+(s.quality-55)/260+(s.net>0?Math.min(.06,s.net/700):-.03),.86,1.15);
 return Math.max(1,Math.round(m*adj))
}
function targetStop(p,s=scorePlayer(p)){
 let i=intel(p),m=marketBaseline(p),f=fairPrice(p,s),target=Math.round(.55*m+.45*f);
 let cap=i.cap!==null?Math.round(Number(i.cap)*state.settings.budget/500):Math.round(target*1.10);
 cap=Math.max(target,cap);

 // Range operativo leggibile:
 // affare <= bargain, compra <= target, priorità <= cap, poi lascia.
 let bargain=Math.max(1,Math.round(Math.min(f,target)*.82));
 if(bargain>=target)bargain=Math.max(1,target-1);
 return {market:m,fair:f,bargain,target,cap}
}
function marketRisk(p){return MARKET_RISK[p.id]||{level:'VERDE',label:'nessun rischio noto',note:'',source:''}}
function soldSet(){return new Set(state.transactions.map(t=>t.playerId))}
function roleSpent(pid,role){return state.transactions.filter(t=>t.participantId===pid&&byId.get(t.playerId)?.role===role).reduce((s,t)=>s+Number(t.price||0),0)}
function remaining(pid){return state.settings.budget-state.transactions.filter(t=>t.participantId===pid).reduce((s,t)=>s+Number(t.price||0),0)}
function roleCount(pid,role){return state.transactions.filter(t=>t.participantId===pid&&byId.get(t.playerId)?.role===role).length}
function opportunity(p){
 let s=scorePlayer(p),ts=targetStop(p,s),value=clamp((ts.fair/Math.max(1,ts.market))*50+45,0,100);
 let scarcity=clamp(100*(1-p.rank/(state.settings.slots[p.role]*10+1)),20,100);
 return Math.round(.45*s.quality+.30*value+.15*scarcity+.10*(intel(p).titularity==='alta'?100:65))
}
function recommendation(p,current){
 let s=scorePlayer(p),ts=targetStop(p,s),risk=marketRisk(p);
 let zone=current<=ts.bargain?'AFFARE':current<=ts.target?'COMPRA':current<=ts.cap?'SOLO SE PRIORITÀ':'LASCIA';
 let decision=zone==='AFFARE'?'COMPRA':zone;
 if(risk.level==='ROSSO'){zone='LASCIA';decision='LASCIA'}
 let deal=clamp(Math.round(60+40*(ts.target-current)/Math.max(4,ts.target)),0,100);
 return {p,s,...ts,zone,decision,deal,risk,opp:opportunity(p)}
}
function roleBudget(role){return Math.round(state.settings.budget*state.settings.shares[role])}

function titularityLabel(p){return intel(p).titularity||'media'}
function passTitularityFilter(p){return titFilter==='all'||titularityLabel(p)===titFilter}
function titularityFilterHtml(){
 return `<label>Titolarità<select onchange="titFilter=this.value;render()">
  <option value="all" ${titFilter==='all'?'selected':''}>Tutte</option>
  <option value="alta" ${titFilter==='alta'?'selected':''}>Alta</option>
  <option value="media" ${titFilter==='media'?'selected':''}>Media</option>
  <option value="bassa" ${titFilter==='bassa'?'selected':''}>Bassa</option>
 </select></label>`
}

function setRole(r){state.settings.role=r;selectedId=null;query='';save();render()}
function choose(id){selectedId=Number(id);let p=byId.get(selectedId);state.settings.role=p.role;query=p.name;save();render()}
function setPrice(v){price=Math.max(1,Number(v)||1);render()}
function assignTo(pid){
 if(!selectedId)return;let p=byId.get(selectedId);
 if(soldSet().has(p.id)){notice='Giocatore già assegnato.';render();return}
 pid=Number(pid);
 let left=remaining(pid);
 if(price>left){notice='Budget insufficiente.';render();return}
 state.transactions.push({
  id:Date.now(),
  playerId:p.id,
  participantId:pid,
  price:Number(price),
  createdAt:new Date().toISOString()
 });
 let owner=state.participants.find(x=>Number(x.id)===pid)?.name||'';
 notice=`${p.name} assegnato a ${owner} per ${price}.`;
 selectedId=null;query='';price=1;save();render()
}
function assign(){assignTo(Number(buyerId))}
function assignMe(){assignTo(Number(state.settings.meId))}
function undoLastAssignment(){
 if(!state.transactions.length){notice='Nessuna assegnazione da annullare.';render();return}
 let t=state.transactions.pop(),p=byId.get(t.playerId),owner=state.participants.find(x=>Number(x.id)===Number(t.participantId))?.name||'';
 notice=`Annullata ultima assegnazione: ${p?.name||'giocatore'} a ${owner} per ${t.price}.`;
 save();render()
}
function resetV5(){
 if(confirm('Reset V5? Cancella solo lo stato della nuova app.')){localStorage.removeItem(STORAGE_KEY);state=defaultState();save();render()}
}
function exportBackup(){
 let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fantacalcio_v5_backup.json';a.click();URL.revokeObjectURL(a.href)
}
function metric(k,v){return `<div class="metric"><span>${esc(k)}</span><b>${esc(v)}</b></div>`}
function modelSelfTest(){
 let d=PLAYERS.find(x=>x.name==='Dimarco'),z=PLAYERS.find(x=>x.name==='Zaccagni');
 if(!d||!z)return {ok:false,text:'TEST DATI FALLITO'};
 let ds=scorePlayer(d),zs=scorePlayer(z);
 let ok=ds.bonus>=32&&ds.bonus<=36&&zs.bonus>=13&&zs.bonus<=18;
 return {ok,text:`Dimarco +${ds.bonus} · Zaccagni +${zs.bonus}`}
}
function header(){
 return `<header><div class="brand"><div><h1>FantaCalcio Copilot V5.3 CLEAN</h1><div class="build">${BUILD_ID} · motore deterministico · nessun Opta runtime · nessun override legacy · <b style="color:${modelSelfTest().ok?'#77e39a':'#ff8b82'}">${modelSelfTest().ok?'SELF-TEST OK':'SELF-TEST FALLITO'}</b> (${modelSelfTest().text})</div></div>
 <div class="budget">Budget IO: <b>${remaining(state.settings.meId)}</b>/500<br>${ROLE_NAMES[state.settings.role]} target: <b>${roleBudget(state.settings.role)}</b></div></div></header>
 <div class="tabs">${[['live','Asta Live'],['ranking','Migliori acquisti'],['scout','Scouting'],['rose','Rose'],['settings','Impostazioni']].map(([k,l])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>`
}
function roleButtons(){return `<div class="roles">${['P','D','C','A'].map(r=>`<button class="${state.settings.role===r?'active':''}" onclick="setRole('${r}')">${ROLE_NAMES[r]}</button>`).join('')}</div>`}
function liveView(){
 let p=selectedId?byId.get(selectedId):null,rec=p?recommendation(p,price):null;
 let candidates=PLAYERS.filter(x=>x.role===state.settings.role&&!soldSet().has(x.id)&&(x.name+' '+x.team).toLowerCase().includes(query.toLowerCase())).slice(0,30);
 return `${roleButtons()}<div class="card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><button class="small" onclick="undoLastAssignment()">↶ ANNULLA ULTIMA ASSEGNAZIONE</button><span class="muted">${state.transactions.length?`Ultima: ${esc(byId.get(state.transactions.at(-1).playerId)?.name||'')} · ${state.transactions.at(-1).price} cr`:'Nessuna assegnazione registrata'}</span></div><input id="search" class="search" placeholder="Cerca giocatore…" value="${esc(query)}" oninput="query=this.value;renderResults()"><div id="results" class="results">${!p?candidates.map(x=>`<button class="result" onclick="choose(${x.id})"><span><b>${esc(x.name)}</b><br><small>${esc(x.team)} · ${x.role} · ${esc(x.rm)}</small></span><span>${intel(x).tier}</span></button>`).join(''):''}</div></div>
 ${notice?`<div class="notice">${esc(notice)}</div>`:''}
 ${!p?'<div class="card muted">Seleziona un giocatore.</div>':playerCard(rec)}`
}
function renderResults(){
 let box=document.getElementById('results');if(!box)return;
 let list=PLAYERS.filter(x=>x.role===state.settings.role&&!soldSet().has(x.id)&&(x.name+' '+x.team).toLowerCase().includes(query.toLowerCase())).slice(0,30);
 box.innerHTML=list.map(x=>`<button class="result" onclick="choose(${x.id})"><span><b>${esc(x.name)}</b><br><small>${esc(x.team)} · ${x.role} · ${esc(x.rm)}</small></span><span>${intel(x).tier}</span></button>`).join('')
}
function playerCard(r){
 let s=r.s,p=r.p,i=intel(p),cls=r.decision==='COMPRA'?'good':r.decision==='LASCIA'?'bad':'warn',ctx=s.context?` · ${s.context}`:'';
 let affareRange=r.bargain<=1?'1':`1–${r.bargain}`,
     buyLow=r.bargain+1,
     buyRange=buyLow<=r.target?`${buyLow}–${r.target}`:`≤ ${r.target}`,
     priorityLow=r.target+1,
     priorityRange=priorityLow<=r.cap?`${priorityLow}–${r.cap}`:`${r.cap}`,
     activeZone=r.zone||'COMPRA';
 return `<div class="card" id="player-card" data-player="${esc(p.name)}">
 <h2 style="margin:0">${esc(p.name)} <small class="muted">${esc(p.team)} · ${p.role} · ${esc(p.rm)}</small></h2>

 <div class="grid">${metric('ACQUISTO',r.opp)}${metric('Q/P',r.deal)}${metric('BONUS',s.bonus)}${metric('MALUS',s.malus)}${metric('NETTO',(s.net>=0?'+':'')+s.net)}</div>

 <div class="priceguide">
   <div class="priceguide-title">QUANTO PUOI SPENDERE SU ${esc(p.name).toUpperCase()}</div>
   <div class="pricezones">
     <div class="pz affare ${activeZone==='AFFARE'?'active':''}"><span>AFFARE</span><b>${affareRange}</b></div>
     <div class="pz compra ${activeZone==='COMPRA'?'active':''}"><span>COMPRA</span><b>${buyRange}</b></div>
     <div class="pz priorita ${activeZone==='SOLO SE PRIORITÀ'?'active':''}"><span>SOLO PRIORITÀ</span><b>${priorityRange}</b></div>
     <div class="pz lascia ${activeZone==='LASCIA'?'active':''}"><span>LASCIA</span><b>${r.cap+1}+</b></div>
   </div>
   <div class="currentline">OFFERTA ATTUALE: ${price} cr · ${activeZone}</div>
 </div>

 <div class="decision ${cls}" id="decision">${r.decision}</div>
 <div class="pricebar"><b>Prezzo asta</b><input id="price" type="number" value="${price}" onchange="setPrice(this.value)"><button onclick="setPrice(price+1)">+1</button><button onclick="setPrice(price+5)">+5</button><button onclick="setPrice(price+10)">+10</button></div>

 <div class="details" style="margin-top:10px">
  <span>Target consigliato: <b>${r.target}</b> · Stop assoluto: <b>${r.cap}</b></span>
  <span>Mercato base: <b>${r.market}</b> · Fair asta: <b>${r.fair}</b></span>
  <span>xFM: <b>${s.xfm}</b> · MV base: ${s.mv}</span>
  <span>Titolarità: <b>${esc(i.titularity)}</b> · Presenze previste: <b>${s.apps}</b></span>
  <span>Integrità fisica: <b>${physicalLabel(p)}</b> · score ${physicalInfo(p).score}/100 · conf. ${physicalInfo(p).confidence}</span>
  <span>Stato fisico: <b>${esc(physicalInfo(p).status)}</b>${physicalInfo(p).estimated?' · stima':''}</span>
  <span id="events">Eventi: <b>${s.goals} gol · ${s.assists} assist</b></span>
  <span>Disciplina: ${s.yc} gialli · ${s.rc} rossi · ${s.penMiss} rigori sbagliati</span>
  <span>Profilo: <b>${esc(s.profile)}</b></span>
  <span>Fonte: <b>${esc(s.source)}</b> · storico ${s.historyWeight}%${ctx}</span>
  <span>Rischio mercato: <b class="badge risk-${r.risk.level}">${r.risk.level}</b> ${esc(r.risk.label)}</span>
  <span>Listone ${p.quote} · FVM500 ~${fvm500(p)}</span>
 </div>

 <div class="assign" style="margin-top:10px">
   <button onclick="assignMe()">ASSEGNA A ME</button>
   <select onchange="buyerId=Number(this.value)">${state.participants.map(x=>`<option value="${x.id}" ${Number(buyerId)===Number(x.id)?'selected':''}>${esc(x.name)} · ${remaining(x.id)} cr</option>`).join('')}</select>
   <button class="secondary" onclick="assign()">Assegna selezionato</button>
 </div>
 </div>`
}
function rankedRows(role,searchText='',importsOnly=false){
 return PLAYERS.filter(p=>p.role===role&&!soldSet().has(p.id))
  .filter(passTitularityFilter)
  .filter(p=>!searchText||(p.name+' '+p.team).toLowerCase().includes(searchText.toLowerCase()))
  .filter(p=>!importsOnly||importSet.has(norm(p.name)))
  .map(p=>{let s=scorePlayer(p),t=targetStop(p,s);return {p,s,t,opp:opportunity(p)}})
}
function rankingView(){
 let rows=rankedRows(state.settings.role).sort((a,b)=>b.opp-a.opp||b.s.quality-a.s.quality).slice(0,80);
 return `${roleButtons()}
 <div class="card">
  <h2>Migliori acquisti</h2>
  <div class="muted">Classifica deterministica: qualità + prezzo mercato + produzione fantasy + scarsità. Fisico: A migliore → D peggiore; * = stima.</div>
  <div class="toolbar" style="margin-top:10px">${titularityFilterHtml()}</div>
 </div>
 ${tableRows(rows)}`
}
function scoutView(){
 let rows=rankedRows(state.settings.role,'',filterImport);
 rows.sort((a,b)=>{
  if(sortScout==='bonus')return b.s.bonus-a.s.bonus;
  if(sortScout==='xfm')return b.s.xfm-a.s.xfm;
  if(sortScout==='fair')return b.t.fair-a.t.fair;
  if(sortScout==='target')return b.t.target-a.t.target;
  return b.s.quality-a.s.quality
 });
 return `${roleButtons()}<div class="card"><div class="muted" style="margin-bottom:8px">Fisico: A migliore → D peggiore; * = stima. Passa sulla scheda Live per leggere stato e affidabilità.</div><div class="toolbar">${titularityFilterHtml()}<label>Ordina<select onchange="sortScout=this.value;render()"><option value="quality" ${sortScout==='quality'?'selected':''}>Qualità</option><option value="bonus" ${sortScout==='bonus'?'selected':''}>Bonus</option><option value="xfm" ${sortScout==='xfm'?'selected':''}>xFM</option><option value="fair" ${sortScout==='fair'?'selected':''}>Fair</option><option value="target" ${sortScout==='target'?'selected':''}>Target</option></select></label><label>Filtro<select onchange="filterImport=this.value==='1';render()"><option value="0">Tutti</option><option value="1" ${filterImport?'selected':''}>Solo import</option></select></label></div></div>${tableRows(rows.slice(0,120))}`
}
function tableRows(rows){
 return `<div class="card scroll"><table class="table"><thead><tr><th>Giocatore</th><th>Tit.</th><th>Fisico</th><th>Q</th><th>Bonus</th><th>Malus</th><th>Netto</th><th>xFM</th><th>Fair</th><th>Range prezzo</th><th>Profilo</th></tr></thead><tbody>${rows.map(x=>`<tr onclick="selectedId=${x.p.id};state.settings.role='${x.p.role}';query='${esc(x.p.name)}';tab='live';render()" style="cursor:pointer"><td><b>${esc(x.p.name)}</b><br><small>${esc(x.p.team)} · ${intel(x.p).tier}</small></td><td><b>${esc(titularityLabel(x.p))}</b></td><td><b>${physicalLabel(x.p)}</b><br><small>${physicalInfo(x.p).confidence}${physicalInfo(x.p).estimated?' · stima':''}</small></td><td>${x.s.quality}</td><td>+${x.s.bonus}</td><td>-${x.s.malus}</td><td>${x.s.net>=0?'+':''}${x.s.net}</td><td>${x.s.xfm}</td><td>${x.t.fair}</td><td><b>≤${x.t.target}</b> compra<br><small>${x.t.target+1}–${x.t.cap} priorità · ${x.t.cap+1}+ lascia</small></td><td>${esc(x.s.profile)}</td></tr>`).join('')}</tbody></table></div>`
}
function roseView(){
 return `<div class="rostergrid">${state.participants.map(t=>{let buys=state.transactions.filter(x=>x.participantId===t.id);return `<div class="card teamcard"><h3>${esc(t.name)} · ${remaining(t.id)} cr</h3>${['P','D','C','A'].map(r=>`<div><b>${r}</b> ${buys.filter(x=>byId.get(x.playerId)?.role===r).map(x=>`${esc(byId.get(x.playerId)?.name)} (${x.price})`).join(', ')||'-'}</div>`).join('')}</div>`}).join('')}</div>`
}
function settingsView(){
 return `<div class="card"><h2>Impostazioni</h2><p><b>Build:</b> ${BUILD_ID}</p><p><b>Stato legacy:</b> ${state.migratedFromLegacy?'transazioni migrate, override ignorati':'nessun override legacy caricato'}</p>
 <p class="muted"><b>Integrità fisica:</b> A = ottima, B = buona, C = rischio/limitazioni, D = elevato rischio fisico. L'asterisco indica una stima.</p><div class="details"><span>Portieri ${Math.round(state.settings.shares.P*100)}% = ${roleBudget('P')}</span><span>Difesa ${Math.round(state.settings.shares.D*100)}% = ${roleBudget('D')}</span><span>Centrocampo ${Math.round(state.settings.shares.C*100)}% = ${roleBudget('C')}</span><span>Attacco ${Math.round(state.settings.shares.A*100)}% = ${roleBudget('A')}</span></div>
 <div style="margin-top:12px"><button class="small" onclick="exportBackup()">Backup JSON</button> <button class="small" onclick="resetV5()">Reset V5</button></div></div>
 <div class="card selftest"><b>Self-test modello finale</b>\n${selfTestText()}</div>`
}
function selfTestText(){
 return ['Dimarco','Zaccagni'].map(n=>{let p=PLAYERS.find(x=>x.name===n),s=scorePlayer(p);return `${n}: BONUS ${s.bonus} | MALUS ${s.malus} | NETTO ${s.net} | ${s.goals}G ${s.assists}A | ${s.source}`}).join('\n')
}
function render(){
 let out=header();
 if(tab==='live')out+=liveView();
 else if(tab==='ranking')out+=rankingView();
 else if(tab==='scout')out+=scoutView();
 else if(tab==='rose')out+=roseView();
 else out+=settingsView();
 document.getElementById('app').innerHTML=out
}
(function boot(){
 // Useful for real end-to-end browser verification, harmless in normal use.
 let q=new URLSearchParams(location.search),name=q.get('player');
 if(name){let p=PLAYERS.find(x=>norm(x.name)===norm(name));if(p){selectedId=p.id;state.settings.role=p.role;query=p.name;tab='live'}}
 render()
})();
</script></body></html>
