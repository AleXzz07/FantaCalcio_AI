<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--accent:#111827;--good:#0f7a43;--goodbg:#dcfce7;--warn:#9a6700;--warnbg:#fef3c7;--bad:#b42318;--badbg:#fee4e2}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1500px;margin:auto;padding:12px 14px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.topbar h1{font-size:25px;margin:0}.topbar h1 span{font-size:12px;background:#111827;color:white;padding:4px 7px;border-radius:7px}.topbar p{margin:3px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:6px}.btn,.ghost,.phase,.tab,.small{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 12px;font-weight:700}.primary{background:#111827;color:#fff;border-color:#111827}.phasebar{display:flex;justify-content:space-between;gap:10px;margin:12px 0}.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}.phase.active,.tab.active,.small.active{background:#111827;color:#fff}.phasebar select{min-width:150px;border:1px solid var(--line);border-radius:10px;padding:9px}
.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:10px}.tab{white-space:nowrap}.notice{background:#e0ecff;border:1px solid #bfdbfe;padding:9px 12px;border-radius:10px;margin-bottom:10px}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:8px 0}.metric{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 10px}.metric span{display:block;color:var(--muted);font-size:11px;font-weight:700}.metric strong{display:block;font-size:21px;margin-top:2px}
.livegrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(285px,.8fr);gap:10px}.card,.page{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px}.card h2,.page h2{font-size:17px;margin:0 0 10px}.card h3{font-size:14px;margin:13px 0 7px}
.searchwrap{position:relative}.search{width:100%;padding:13px;border:1px solid #cfd4dc;border-radius:11px;font-size:17px}.suggestions{position:absolute;left:0;right:0;z-index:20;background:white;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #0002;max-height:330px;overflow:auto}.suggestions button{width:100%;border:0;border-bottom:1px solid #eee;background:white;text-align:left;padding:10px}.suggestions button b,.suggestions button span{display:block}.suggestions button span{font-size:12px;color:var(--muted)}
.pricerow{display:grid;grid-template-columns:55px 110px repeat(4,1fr);gap:6px;margin:10px 0}.pricerow button,.pricerow input{border:1px solid var(--line);border-radius:9px;padding:10px;background:white;text-align:center;font-weight:800}.pricerow input{font-size:18px}
.decisionmetrics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.decision{font-size:27px;font-weight:900;text-align:center;border-radius:11px;padding:10px;margin:8px 0}.COMPRA,.RILANCIA{background:var(--goodbg);color:var(--good)}.SOLO{background:var(--warnbg);color:var(--warn)}.LASCIA{background:var(--badbg);color:var(--bad)}
.decisionnote{text-align:center;font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.chips span{background:#f2f4f7;border-radius:999px;padding:5px 8px;font-size:12px}.intel{color:#475467;font-size:13px}
details{border-top:1px solid var(--line);padding-top:7px}.detailsgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;font-size:13px;margin-top:6px}
.alts>div,.opp,.histrow,.rosterrow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #eee;padding:8px 0}.alts span,.opp small,.histrow small,.rosterrow small{display:block;color:var(--muted);font-size:11px}.alts strong{white-space:nowrap}

.quickassign{display:none}
.quickassign select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px}
.quickassign h3{margin:0 0 8px;font-size:16px}

.danger{margin-top:15px}.danger button{background:#b42318;color:#fff;border:0;border-radius:9px;padding:10px 15px}

function fallbackBonusModel(p,i){

function scoutView(){let list=PLAYERS.filter(p=>p.role===scoutRole&&(p.name+' '+p.team).toLowerCase().includes(scoutQ.toLowerCase())).slice(0,80);return `<section class="page"><div class="pagehead"><h2>Scouting</h2><div class="scoutcontrols">${ROLES.map(r=>`<button class="small ${scoutRole===r?'active':''}" onclick="scoutRole='${r}';render()">${r}</button>`).join('')}</div></div><input id="scoutQ" class="search" placeholder="Cerca giocatore…" value="${esc(scoutQ)}"><div class="scoutlist">${list.map(p=>{let i=intel(p,state.overrides[p.id]),s=playerScore(p);return `<button class="scoutrow" onclick="openOverride(${p.id})"><span><b>${esc(p.name)}</b><small>${esc(p.team)} · ${listoneText(p)} · FVM500 ~${fvm500(p)} · ${marketRisk(p).level} mercato · qualità ${s.total} · xFM ${s.xfm.toFixed(2)} · +${s.expectedBonus}/-${s.expectedMalus} · netto ${s.expectedNet>=0?'+':''}${s.expectedNet}${s.advanced?` · xG*90 ${s.advanced.xg90} · xA*90 ${s.advanced.xa90}`:' · fallback'} · fisico ${physicalText(s)}</small></span><strong>${esc(i.tier)}</strong><em>${i.target??'auto'} / ${i.cap??'auto'}</em></button>`}).join('')}</div></section>`}
function rankingView(){
 let unavailable=new Set([...state.transactions.map(t=>t.playerId),...state.unsold.map(u=>u.playerId)]),q=rankQ.trim().toLowerCase();
 let ranked=PLAYERS.filter(p=>p.role===rankRole&&!unavailable.has(p.id)).filter(p=>!q||(p.name+' '+p.team).toLowerCase().includes(q)).map(p=>{let s=playerScore(p),r=recommend(p.id,0);return {p,s,r}}).sort((a,b)=>b.r.opportunity.score-a.r.opportunity.score||b.r.opportunity.deal-a.r.opportunity.deal||b.s.total-a.s.total);
 let uns=state.unsold.map(u=>byId.get(u.playerId)).filter(Boolean);
 return `<section class="page"><div class="pagehead"><h2>Migliori acquisti adesso</h2><div class="scoutcontrols">${ROLES.map(r=>`<button class="small ${rankRole===r?'active':''}" onclick="rankRole='${r}';render()">${r}</button>`).join('')}</div></div>
 <div class="rankintro"><div class="weight"><b>37%</b><small>qualità</small></div><div class="weight"><b>28%</b><small>qualità/prezzo</small></div><div class="weight"><b>15%</b><small>fit rosa</small></div><div class="weight"><b>10%</b><small>budget</small></div><div class="weight"><b>5%</b><small>scarsità</small></div><div class="weight"><b>5%</b><small>netto bonus/malus</small></div></div>
 ${(()=>{let c=marketRiskCounts();return `<div class="marketwatch"><b>Mercato 31/08:</b> <span class="badge marketR">${c.ROSSO} rossi</span> <span class="badge marketO">${c.ARANCIONE} arancioni</span> <span class="badge marketY">${c.GIALLO} gialli</span><span class="marketnote">I rossi vengono forzati su LASCIA; arancioni e gialli ricevono un cap prudenziale finché il mercato non si chiude.</span></div>`})()} <p class="muted">La classifica cambia dopo ogni acquisto e ora mostra <b>tutti</b> i giocatori disponibili del ruolo. <b>Qualità</b> combina rendimento, xFantamedia, bonus e malus attesi, titolarità, fisico e modificatore. <b>Q/P</b> confronta il prezzo con il valore statistico derivato dai fantapunti stagionali sopra il livello di rimpiazzo (VORP). <b>Netto</b> = bonus attesi − malus attesi. Con storico disponibile usa 2023/24–2025/26 Opta: minuti, G/A, tiri in porta, key pass e cartellini. xG/xA sono proxy di processo, non dati xG ufficiali. Nuovi arrivi: fallback individuale. <b>Rischio mercato</b>: ROSSO = uscita quasi certa/molto probabile, ARANCIONE = trattativa concreta, GIALLO = da monitorare.</p>
 ${uns.length?`<div class="card unsoldList"><h3>INVENDUTI (${uns.length})</h3>${uns.map(p=>`<div class="unsoldRow"><span><b>${esc(p.name)}</b><small>${esc(p.team)} · ${p.role} · ${listoneText(p)}</small></span><button class="small" onclick="relistUnsold(${p.id})">Rimetti in asta</button></div>`).join('')}</div>`:''}
 <input id="rankQ" class="search" placeholder="Cerca…" value="${esc(rankQ)}">
 <div class="rankrow" style="font-weight:900"><span>#</span><span>Giocatore</span><span>Acq.</span><span>Q/P</span><span class="rankmobilehide">Netto</span><span class="rankhide">Target</span><span class="rankhide">Apri</span></div>
 <div id="rankList">${ranked.map((x,idx)=>`<div class="rankrow"><b>${idx+1}</b><span><b>${esc(x.p.name)}</b><small>${esc(x.p.team)} · ${marketRisk(x.p).level} mercato · qualità ${x.s.total} · ${buyBand(x.r)} · ${listoneText(x.p)} · FVM500 ~${fvm500(x.p)} · Fair ${x.r.opportunity.fairPrice} · VORP ${x.r.opportunity.vorp} · xFM ${x.s.xfm.toFixed(2)} · +${x.s.expectedBonus}/-${x.s.expectedMalus} · ${x.s.advanced?`xG*90 ${x.s.advanced.xg90} · xA*90 ${x.s.advanced.xa90}`:'fallback'} · fisico ${physicalText(x.s)}</small></span><strong class="oppScore">${x.r.opportunity.score}</strong><span><span class="badge deal${dealGrade(x.r.opportunity.deal)}">${x.r.opportunity.deal}</span></span><strong class="rankmobilehide">${x.s.expectedNet>=0?'+':''}${x.s.expectedNet}</strong><strong class="rankhide">${x.r.liveTarget}/${x.r.hardCap}</strong><button class="small rankhide" onclick="selectedId=${x.p.id};search=PLAYERS.find(p=>p.id===${x.p.id}).name+' · '+PLAYERS.find(p=>p.id===${x.p.id}).team;tab='live';render()">Asta</button></div>`).join('')}</div></section>`
}
function applyBudgetPreset(){state.settings.shares={P:.13,D:.16,C:.22,A:.49};save();notice='Preset applicato: P65 / D80 / C110 / A245.';render()}
function settingsView(){return `<section class="page"><h2>Impostazioni</h2><div class="settingsgrid"><div class="card"><h3>Lega</h3><label>Budget<input id="setBudget" type="number" value="${state.settings.initialBudget}"></label>${ROLES.map(r=>`<label>Slot ${r}<input class="slot" data-r="${r}" type="number" value="${state.settings.slots[r]}"></label>`).join('')}</div><div class="card"><h3>Budget obiettivo</h3>${ROLES.map(r=>`<label>${r} %<input class="share" data-r="${r}" type="number" value="${Math.round(state.settings.shares[r]*100)}"></label>`).join('')}<p class="muted">Preset consigliato V4.11.1: P65 / D80 / C110 / A245 su 500. Sono obiettivi, non obblighi.</p><button class="small" onclick="applyBudgetPreset()">Applica preset V4.11.1</button></div><div class="card" style="grid-column:span 2"><h3>Nomi squadre</h3>${state.participants.map(p=>`<label>${p.id}<input class="teamname" data-id="${p.id}" value="${esc(p.name)}"></label>`).join('')}</div></div><div class="danger"><button onclick="resetAuction()">AZZERA ASTA</button></div></section>`}
function overrideModal(){if(!editId)return '';let p=byId.get(editId),i=intel(p,state.overrides[p.id]),s=playerScore(p),ov=state.overrides[p.id]||{};return `<div class="modalbg" onclick="editId=null;render()"><div class="modal" onclick="event.stopPropagation()"><h2>${esc(p.name)} · V4.11.1 ${s.total}</h2><p class="muted">Fisico attuale: <b>${physicalText(s)}</b> · conf. ${esc(s.physicalConfidence)}<br>${esc(s.physicalStatus)}</p><label>Tier<input id="ovTier" value="${esc(i.tier)}"></label><label>Titolarità (alta/media/bassa)<input id="ovTit" value="${esc(i.titularity||'media')}"></label><label>Affidabilità fisica manuale (A/B/C/D oppure auto)<input id="ovPhysical" value="${esc(ov.physical||'auto')}"></label><label>Target manuale<input id="ovTarget" type="number" value="${i.target??''}"></label><label>Hard cap manuale<input id="ovCap" type="number" value="${i.cap??''}"></label><label>Nota<textarea id="ovNote">${esc(i.note||'')}</textarea></label><div class="assignbuttons"><button onclick="editId=null;render()">Annulla</button><button class="primary" onclick="saveOverride()">Salva</button></div></div></div>`}
function render(){
 document.getElementById('app').innerHTML=`<main class="shell"><header class="topbar"><div><h1>Fanta Copilot <span>V4.11.1</span></h1><p>iPad · listone 31/08 · Opta 3 stagioni · bonus/malus · VORP · rischio mercato</p><small class="muted">524 giocatori · ${ADV_STATUS}</small></div><div class="actions"><button class="ghost" onclick="backup()">Backup</button><button class="ghost" onclick="document.getElementById('restoreFile').click()">Ripristina</button></div></header><section class="phasebar"><div class="phases">${ROLES.map(r=>`<button class="phase ${state.settings.currentRole===r?'active':''}" onclick="setRole('${r}')">${roleLabel[r]}</button>`).join('')}</div><select id="meSel">${state.participants.map(p=>`<option value="${p.id}" ${state.settings.meId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></section><nav class="tabs">${[['live','ASTA LIVE'],['ranking','MIGLIORI ACQUISTI'],['rose','ROSE'],['scout','SCOUTING'],['settings','IMPOSTAZIONI']].map(([k,l])=>`<button class="tab ${tab===k?'active':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</nav>${notice?`<div class="notice" onclick="notice='';render()">${esc(notice)}</div>`:''}${tab==='live'?liveView():tab==='ranking'?rankingView():tab==='rose'?roseView():tab==='scout'?scoutView():settingsView()}<footer>V4.11.1 salva automaticamente in Safari. Backup JSON + CSV consigliati a fine reparto.</footer></main>${overrideModal()}`;
 bind();
}
function bind(){
 let s=$('#search');if(s)s.oninput=e=>{
   search=e.target.value; selectedId=null;
   let box=$('#suggestions'); if(!box)return;
   let unavailable=new Set([...state.transactions.map(t=>t.playerId),...state.unsold.map(u=>u.playerId)]);
   let available=PLAYERS.filter(p=>p.role===state.settings.currentRole&&!unavailable.has(p.id));
   let q=search.trim().toLowerCase();
   if(!q){box.innerHTML='';box.classList.add('hidden');return}
   let sugs=available.filter(p=>(p.name+' '+p.team).toLowerCase().includes(q)).slice(0,12);
   box.innerHTML=sugs.map(p=>{let sc=playerScore(p);return `<button onclick="choose(${p.id})"><b>${esc(p.name)}</b><span>${esc(p.team)} · V4 ${sc.total} · fisico ${sc.grade} · rank ${v4Rank(p)}</span></button>`}).join('')||'<div style="padding:10px">Nessun giocatore libero.</div>';
   box.classList.remove('hidden');
 };
 let p=$('#price');if(p)p.onchange=e=>setPrice(e.target.value);
 let b=$('#buyer');if(b)b.onchange=e=>buyerId=Number(e.target.value);
 let me=$('#meSel');if(me)me.onchange=e=>{state.settings.meId=Number(e.target.value);buyerId=state.settings.meId;roseTeam=state.settings.meId;save();render()};
 let rt=$('#roseTeam');if(rt)rt.onchange=e=>{roseTeam=Number(e.target.value);render()};
 let sq=$('#scoutQ');if(sq)sq.oninput=e=>{
   scoutQ=e.target.value;
   let box=document.querySelector('.scoutlist'); if(!box)return;
   let list=PLAYERS.filter(p=>p.role===scoutRole&&(p.name+' '+p.team).toLowerCase().includes(scoutQ.toLowerCase())).slice(0,80);
   box.innerHTML=list.map(p=>{let i=intel(p,state.overrides[p.id]);return `<button class="scoutrow" onclick="openOverride(${p.id})"><span><b>${esc(p.name)}</b><small>${esc(p.team)} · rank ${p.rank}</small></span><strong>${esc(i.tier)}</strong><em>${i.target??'auto'} / ${i.cap??'auto'}</em></button>`}).join('');
 };
 let rq=$('#rankQ');if(rq)rq.oninput=e=>{
   rankQ=e.target.value;let box=$('#rankList');if(!box)return;
   let unavailable=new Set([...state.transactions.map(t=>t.playerId),...state.unsold.map(u=>u.playerId)]),q=rankQ.trim().toLowerCase();
   let ranked=PLAYERS.filter(p=>p.role===rankRole&&!unavailable.has(p.id)).filter(p=>!q||(p.name+' '+p.team).toLowerCase().includes(q))
     .map(p=>{let s=playerScore(p),r=recommend(p.id,0);return {p,s,r}})
     .sort((a,b)=>b.r.opportunity.score-a.r.opportunity.score||b.r.opportunity.deal-a.r.opportunity.deal||b.s.total-a.s.total);
   box.innerHTML=ranked.map((x,idx)=>`<div class="rankrow"><b>${idx+1}</b><span><b>${esc(x.p.name)}</b><small>${esc(x.p.team)} · ${marketRisk(x.p).level} mercato · ${buyBand(x.r)} · ${listoneText(x.p)} · FVM500 ~${fvm500(x.p)} · Fair ${x.r.opportunity.fairPrice} · VORP ${x.r.opportunity.vorp} · xFM ${x.s.xfm.toFixed(2)} · +${x.s.expectedBonus}/-${x.s.expectedMalus}${x.s.advanced?` · xG*90 ${x.s.advanced.xg90} · xA*90 ${x.s.advanced.xa90}`:' · fallback'}</small></span><strong class="oppScore">${x.r.opportunity.score}</strong><span><span class="badge deal${dealGrade(x.r.opportunity.deal)}">${x.r.opportunity.deal}</span></span><strong class="rankmobilehide">${x.s.expectedNet>=0?'+':''}${x.s.expectedNet}</strong><strong class="rankhide">${x.r.liveTarget}/${x.r.hardCap}</strong><button class="small rankhide" onclick="selectedId=${x.p.id};search=PLAYERS.find(p=>p.id===${x.p.id}).name+' · '+PLAYERS.find(p=>p.id===${x.p.id}).team;tab='live';render()">Asta</button></div>`).join('');
 };
 let sb=$('#setBudget');if(sb)sb.onchange=e=>{state.settings.initialBudget=Math.max(1,Number(e.target.value)||500);save();render()};
 document.querySelectorAll('.slot').forEach(x=>x.onchange=e=>{state.settings.slots[e.target.dataset.r]=Math.max(0,Number(e.target.value)||0);save()});
 document.querySelectorAll('.share').forEach(x=>x.onchange=e=>{state.settings.shares[e.target.dataset.r]=(Number(e.target.value)||0)/100;save()});
 document.querySelectorAll('.teamname').forEach(x=>x.onchange=e=>{let p=state.participants.find(y=>y.id===Number(e.target.dataset.id));if(p)p.name=e.target.value;save();render()});
}
function doTactical(){nomination=tactical();render()}
function openOverride(id){editId=id;render()}
function saveOverride(){let ph=String($('#ovPhysical').value||'auto').trim().toUpperCase();if(ph==='AUTO')ph=null;state.overrides[editId]={...(state.overrides[editId]||{}),tier:$('#ovTier').value,titularity:$('#ovTit').value,physical:ph,target:$('#ovTarget').value?Number($('#ovTarget').value):null,cap:$('#ovCap').value?Number($('#ovCap').value):null,note:$('#ovNote').value};editId=null;save();render()}
document.getElementById('restoreFile').onchange=e=>{let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=migrateState(JSON.parse(String(r.result)));buyerId=state.settings.meId;roseTeam=state.settings.meId;save();notice='Backup importato.'}catch{notice='Backup non valido.'}render()};r.readAsText(f)};
render();
setTimeout(()=>loadAdvancedData(false),60);
</script>
</body>
</html>
