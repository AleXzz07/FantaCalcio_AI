<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--accent:#111827;--good:#0f7a43;--goodbg:#dcfce7;--warn:#9a6700;--warnbg:#fef3c7;--bad:#b42318;--badbg:#fee4e2}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1500px;margin:auto;padding:12px 14px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.topbar h1{font-size:25px;margin:0}.topbar h1 span{font-size:12px;background:#111827;color:white;padding:4px 7px;border-radius:7px}.topbar p{margin:3px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:6px}.btn,.ghost,.phase,.tab,.small{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 12px;font-weight:700}.primary{background:#111827;color:#fff;border-color:#111827}.phasebar{display:flex;justify-content:space-between;gap:10px;margin:12px 0}.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}.phase.active,.tab.active,.small.active{background:#111827;color:#fff}.phasebar select{min-width:150px;border:1px solid var(--line);border-radius:10px;padding:9px}
.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:10px}.tab{white-space:nowrap}.notice{background:#e0ecff;border:1px solid #bfdbfe;padding:9px 12px;border-radius:10px;margin-bottom:10px}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:8px 0}.metric{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 10px}.metric span{display:block;color:var(--muted);font-size:11px;font-weight:700}.metric strong{display:block;font-size:21px;margin-top:2px}
.livegrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(285px,.8fr);gap:10px}.card,.page{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px}.card h2,.page h2{font-size:17px;margin:0 0 10px}.card h3{font-size:14px;margin:13px 0 7px}
.searchwrap{position:relative}.search{width:100%;padding:13px;border:1px solid #cfd4dc;border-radius:11px;font-size:17px}.suggestions{position:absolute;left:0;right:0;z-index:20;background:white;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #0002;max-height:330px;overflow:auto}.suggestions button{width:100%;border:0;border-bottom:1px solid #eee;background:white;text-align:left;padding:10px}.suggestions button b,.suggestions button span{display:block}.suggestions button span{font-size:12px;color:var(--muted)}
.pricerow{display:grid;grid-template-columns:55px 110px repeat(4,1fr);gap:6px;margin:10px 0}.pricerow button,.pricerow input{border:1px solid var(--line);border-radius:9px;padding:10px;background:white;text-align:center;font-weight:800}.pricerow input{font-size:18px}
.decisionmetrics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.decision{font-size:27px;font-weight:900;text-align:center;border-radius:11px;padding:10px;margin:8px 0}.COMPRA,.RILANCIA{background:var(--goodbg);color:var(--good)}.SOLO{background:var(--warnbg);color:var(--warn)}.LASCIA{background:var(--badbg);color:var(--bad)}
.decisionnote{text-align:center;font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.chips span{background:#f2f4f7;border-radius:999px;padding:5px 8px;font-size:12px}.intel{color:#475467;font-size:13px}
details{border-top:1px solid var(--line);padding-top:7px}.detailsgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;font-size:13px;margin-top:6px}
.alts>div,.opp,.histrow,.rosterrow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #eee;padding:8px 0}.alts span,.opp small,.histrow small,.rosterrow small{display:block;color:var(--muted);font-size:11px}.alts strong{white-space:nowrap}
.side{display:flex;flex-direction:column;gap:10px}.side select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px}.assignbuttons{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:7px 0}.assignbuttons button,.undo,.tactical{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font-weight:800}.rolemini{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.rolemini div{text-align:center;background:#f8fafc;padding:7px;border-radius:8px}.rolemini span,.rolemini small{display:block}.rolemini small{color:var(--muted)}
.history{margin-top:10px}.page{min-height:500px}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:8px}.pagehead select{padding:8px;border:1px solid var(--line);border-radius:9px}.rostergrid,.settingsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.scoutcontrols{display:flex;gap:5px;margin-bottom:8px}.scoutlist{margin-top:8px}.scoutrow{width:100%;display:grid;grid-template-columns:1fr 65px 100px;gap:8px;align-items:center;text-align:left;border:0;border-top:1px solid #eee;background:white;padding:9px}.scoutrow small{display:block;color:var(--muted)}label{display:block;font-size:12px;font-weight:700;margin:7px 0}label input,label textarea{width:100%;display:block;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:3px}
.modalbg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:99}.modal{background:white;border-radius:14px;padding:16px;width:min(520px,100%)}.hidden{display:none!important}.muted{color:var(--muted)}footer{color:var(--muted);text-align:center;font-size:11px;margin-top:14px}
.danger{margin-top:15px}.danger button{background:#b42318;color:#fff;border:0;border-radius:9px;padding:10px 15px}
@media(max-width:850px){.shell{padding:9px}.topbar{align-items:flex-start}.topbar p{display:none}.actions .ghost{padding:8px}.phasebar{display:block}.phasebar select{width:100%;margin-top:6px}.metrics{grid-template-columns:repeat(3,1fr)}.livegrid{grid-template-columns:1fr}.pricerow{grid-template-columns:50px 90px repeat(2,1fr)}.decisionmetrics{grid-template-columns:repeat(5,1fr)}.metric strong{font-size:18px}.rostergrid,.settingsgrid{grid-template-columns:1fr 1fr}.side{display:grid;grid-template-columns:1fr 1fr}.history{margin-bottom:70px}}
@media(max-width:520px){.topbar h1{font-size:21px}.metrics{grid-template-columns:repeat(2,1fr)}.decisionmetrics{grid-template-columns:repeat(5,1fr)}.decisionmetrics .metric{padding:6px}.decisionmetrics .metric strong{font-size:16px}.side{grid-template-columns:1fr}.rostergrid,.settingsgrid{grid-template-columns:1fr}.phases .phase{font-size:11px;padding:9px 4px}}
</style>

function assign(toMe){if(!selectedId){notice='Seleziona un giocatore.';render();return}let p=byId.get(selectedId),pid=toMe?state.settings.meId:Number(buyerId),mi=missing(state.transactions,pid,state.settings.slots);if(mi[p.role]<=0){notice='Questa squadra ha già completato il ruolo.';render();return}let rb=remaining(state.transactions,pid,state.settings.initialBudget),tot=sum(Object.values(mi)),max=rb-Math.max(0,tot-1);if(price<1||price>max){notice=`Prezzo non valido. Massimo teorico: ${max}.`;render();return}state.transactions.push({id:(state.transactions.at(-1)?.id||0)+1,playerId:p.id,participantId:pid,price,createdAt:new Date().toISOString()});notice=`${p.name} assegnato per ${price}.`;selectedId=null;search='';price=1;nomination=null;save();render()}

function backup(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download=`fantacalcio-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetAuction(){if(confirm("Azzero tutta l'asta?")){let names=state.participants,me=state.settings.meId;state=defaultState();state.participants=names;state.settings.meId=me;buyerId=me;save();notice='Asta azzerata.';render()}}
function liveView(){
 let rb=remaining(state.transactions,state.settings.meId,state.settings.initialBudget),sp=roleSpend(state.transactions,state.settings.meId),mi=missing(state.transactions,state.settings.meId,state.settings.slots),co=roleCounts(state.transactions,state.settings.meId),sold=new Set(state.transactions.map(t=>t.playerId)),available=PLAYERS.filter(p=>p.role===state.settings.currentRole&&!sold.has(p.id)),q=search.trim().toLowerCase(),sugs=q?available.filter(p=>(p.name+' '+p.team).toLowerCase().includes(q)).slice(0,12):[],rec=selectedId?recommend(selectedId,price):null,alts=selectedId?alternatives(selectedId):[],opps=opponentTable().filter(o=>o.id!==state.settings.meId).slice(0,4);
 return `<section class="metrics">${metric('BUDGET',rb)}${metric('SPESO',state.settings.initialBudget-rb)}${metric('SPESO '+state.settings.currentRole,sp[state.settings.currentRole])}${metric('OBIETTIVO',Math.round(state.settings.initialBudget*state.settings.shares[state.settings.currentRole]))}${metric('MANCANO',mi[state.settings.currentRole])}${metric('POSTI TOTALI',sum(Object.values(mi)))}</section>
 <section class="livegrid"><div class="card"><h2>Giocatore chiamato</h2><div class="searchwrap"><input id="search" class="search" value="${esc(search)}" placeholder="Scrivi il nome…" autocomplete="off"><div id="suggestions" class="suggestions ${q&&!selectedId?'':'hidden'}">${q&&!selectedId?(sugs.map(p=>`<button onclick="choose(${p.id})"><b>${esc(p.name)}</b><span>${esc(p.team)} · rank ${p.rank} · FVM ${Math.round(p.fvm)}</span></button>`).join('')||'<div style="padding:10px">Nessun giocatore libero.</div>'):''}</div></div>
 <div class="pricerow"><button onclick="setPrice(price-1)">−1</button><input id="price" type="number" min="1" value="${price}"><button onclick="setPrice(price+1)">+1</button><button onclick="setPrice(price+2)">+2</button><button onclick="setPrice(price+5)">+5</button><button onclick="setPrice(price+10)">+10</button></div>
 ${!rec?'<div class="muted" style="padding:25px;text-align:center">Seleziona un giocatore per vedere il consiglio.</div>':`<div class="decisionmetrics">${metric('TIER',rec.info.tier)}${metric('MERCATO',rec.marketTarget)}${metric('TARGET',rec.liveTarget)}${metric('HARD CAP',rec.hardCap)}${metric('OFFERTA',price)}</div><div class="decision ${rec.decision.startsWith('SOLO')?'SOLO':rec.decision}">${esc(rec.decision)}</div><div class="decisionnote">${rec.decision==='LASCIA'?`STOP ${rec.hardCap}. Sopra questo prezzo non conviene.`:rec.decision==='SOLO SE PRIORITÀ'?`Sei sopra target. Massimo ${rec.hardCap}.`:`Target ${rec.liveTarget} · stop ${rec.hardCap}.`}</div><div class="chips"><span>Inflazione ${((rec.inflation-1)*100>=0?'+':'')+((rec.inflation-1)*100).toFixed(1)}%</span><span>Scarsità ${((rec.scarcity-1)*100>=0?'+':'')+((rec.scarcity-1)*100).toFixed(1)}%</span><span>${rec.budgetZone}</span><span>Conf. ${rec.confidence}</span></div>${rec.info.note?`<p class="intel">${esc(rec.info.note)}</p>`:''}<details><summary>Perché?</summary><div class="detailsgrid"><span>Titolarità: <b>${esc(rec.info.titularity)}</b></span><span>Integrità: <b>${esc(rec.info.injury)}</b></span><span>Rigori: <b>${esc(rec.info.penalty)}</b></span><span>Mod: <b>${esc(rec.info.mod)}</b></span><span>Cap budget: <b>${rec.budgetCap}</b></span>${rec.structureCap!==null?`<span>Cap struttura: <b>${rec.structureCap}</b></span>`:''}${rec.pairCap!==null?`<span>Cap pacchetto: <b>${rec.pairCap}</b></span>`:''}</div></details><h3>Alternative immediate</h3><div class="alts">${alts.map(a=>`<div><span><b>${esc(a.name)}</b><small>${esc(a.team)} · ${esc(a.tier)}</small></span><strong>${a.target}/${a.cap}</strong></div>`).join('')}</div>`}</div>
 <aside class="side"><div class="card"><h2>Assegna</h2><select id="buyer">${state.participants.map(p=>`<option value="${p.id}" ${Number(buyerId)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="assignbuttons"><button class="primary" onclick="assign(true)" ${!selectedId?'disabled':''}>A ME · ${price}</button><button onclick="assign(false)" ${!selectedId?'disabled':''}>ASSEGNA · ${price}</button></div><button class="undo" onclick="undo()" ${!state.transactions.length?'disabled':''}>↶ Annulla ultima</button></div>
 <div class="card"><h2>La mia rosa</h2><div class="rolemini">${ROLES.map(r=>`<div><b>${r}</b><span>${co[r]}/${state.settings.slots[r]}</span><small>${sp[r]} cr</small></div>`).join('')}</div></div>
 <div class="card"><h2>Avversari pericolosi</h2>${opps.map(o=>`<div class="opp"><span><b>${esc(o.name)}</b><small>${o.roleNeed} posti ${state.settings.currentRole}</small></span><strong>${o.credits}</strong></div>`).join('')}</div>
 <div class="card"><button class="tactical" onclick="doTactical()">CHIAMATA TATTICA</button>${nomination?`<div style="padding-top:8px"><b>${esc(nomination.p.name)}</b><br><span class="muted">${esc(nomination.p.team)} · ${esc(nomination.r.info.tier)}</span><br><strong>target ${nomination.r.liveTarget} · stop ${nomination.r.hardCap}</strong></div>`:''}</div></aside></section>
 <section class="card history"><h2>Ultime assegnazioni</h2>${[...state.transactions].reverse().slice(0,8).map(t=>{let p=byId.get(t.playerId),own=state.participants.find(x=>x.id===t.participantId);return `<div class="histrow"><span><b>${esc(p?.name)}</b><small>${p?.role} · ${esc(own?.name)}</small></span><strong>${t.price}</strong></div>`}).join('')||'<p class="muted">Nessuna assegnazione.</p>'}</section>`;
}
function roseView(){let tx=state.transactions.filter(t=>t.participantId===Number(roseTeam)),rb=remaining(state.transactions,Number(roseTeam),state.settings.initialBudget),sp=roleSpend(state.transactions,Number(roseTeam)),co=roleCounts(state.transactions,Number(roseTeam));return `<section class="page"><div class="pagehead"><h2>Rose & avversari</h2><select id="roseTeam">${state.participants.map(p=>`<option value="${p.id}" ${Number(roseTeam)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="metrics">${metric('CREDITI',rb)}${ROLES.map(r=>metric(`${r} · ${co[r]}/${state.settings.slots[r]}`,`${sp[r]} cr`)).join('')}</div><div class="rostergrid">${ROLES.map(r=>`<div class="card"><h3>${roleLabel[r]}</h3>${tx.map(t=>({t,p:byId.get(t.playerId)})).filter(x=>x.p?.role===r).sort((a,b)=>a.p.rank-b.p.rank).map(({t,p})=>`<div class="rosterrow"><span><b>${esc(p.name)}</b><small>${esc(p.team)} · ${esc(intel(p,state.overrides[p.id]).tier)}</small></span><strong>${t.price}</strong></div>`).join('')||'<span class="muted">—</span>'}</div>`).join('')}</div></section>`}
function scoutView(){let list=PLAYERS.filter(p=>p.role===scoutRole&&(p.name+' '+p.team).toLowerCase().includes(scoutQ.toLowerCase())).slice(0,80);return `<section class="page"><div class="pagehead"><h2>Scouting</h2><div class="scoutcontrols">${ROLES.map(r=>`<button class="small ${scoutRole===r?'active':''}" onclick="scoutRole='${r}';render()">${r}</button>`).join('')}</div></div><input id="scoutQ" class="search" placeholder="Cerca giocatore…" value="${esc(scoutQ)}"><div class="scoutlist">${list.map(p=>{let i=intel(p,state.overrides[p.id]);return `<button class="scoutrow" onclick="openOverride(${p.id})"><span><b>${esc(p.name)}</b><small>${esc(p.team)} · rank ${p.rank}</small></span><strong>${esc(i.tier)}</strong><em>${i.target??'auto'} / ${i.cap??'auto'}</em></button>`}).join('')}</div></section>`}
function settingsView(){return `<section class="page"><h2>Impostazioni</h2><div class="settingsgrid"><div class="card"><h3>Lega</h3><label>Budget<input id="setBudget" type="number" value="${state.settings.initialBudget}"></label>${ROLES.map(r=>`<label>Slot ${r}<input class="slot" data-r="${r}" type="number" value="${state.settings.slots[r]}"></label>`).join('')}</div><div class="card"><h3>Budget obiettivo</h3>${ROLES.map(r=>`<label>${r} %<input class="share" data-r="${r}" type="number" value="${Math.round(state.settings.shares[r]*100)}"></label>`).join('')}<p class="muted">Default P10 / D17 / C23 / A50.</p></div><div class="card" style="grid-column:span 2"><h3>Nomi squadre</h3>${state.participants.map(p=>`<label>${p.id}<input class="teamname" data-id="${p.id}" value="${esc(p.name)}"></label>`).join('')}</div></div><div class="danger"><button onclick="resetAuction()">AZZERA ASTA</button></div></section>`}
function overrideModal(){if(!editId)return '';let p=byId.get(editId),i=intel(p,state.overrides[p.id]);return `<div class="modalbg" onclick="editId=null;render()"><div class="modal" onclick="event.stopPropagation()"><h2>${esc(p.name)}</h2><label>Tier<input id="ovTier" value="${esc(i.tier)}"></label><label>Target manuale<input id="ovTarget" type="number" value="${i.target??''}"></label><label>Hard cap manuale<input id="ovCap" type="number" value="${i.cap??''}"></label><label>Nota<textarea id="ovNote">${esc(i.note||'')}</textarea></label><div class="assignbuttons"><button onclick="editId=null;render()">Annulla</button><button class="primary" onclick="saveOverride()">Salva</button></div></div></div>`}
function render(){
 document.getElementById('app').innerHTML=`<main class="shell"><header class="topbar"><div><h1>Fanta Copilot <span>V3.1 SINGLE</span></h1><p>iPad · Vercel · un solo file · salvataggio locale</p></div><div class="actions"><button class="ghost" onclick="backup()">Backup</button><button class="ghost" onclick="document.getElementById('restoreFile').click()">Ripristina</button></div></header><section class="phasebar"><div class="phases">${ROLES.map(r=>`<button class="phase ${state.settings.currentRole===r?'active':''}" onclick="setRole('${r}')">${roleLabel[r]}</button>`).join('')}</div><select id="meSel">${state.participants.map(p=>`<option value="${p.id}" ${state.settings.meId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></section><nav class="tabs">${[['live','ASTA LIVE'],['rose','ROSE'],['scout','SCOUTING'],['settings','IMPOSTAZIONI']].map(([k,l])=>`<button class="tab ${tab===k?'active':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</nav>${notice?`<div class="notice" onclick="notice='';render()">${esc(notice)}</div>`:''}${tab==='live'?liveView():tab==='rose'?roseView():tab==='scout'?scoutView():settingsView()}<footer>Salvataggio automatico in Safari. Fai un backup JSON prima dell'asta.</footer></main>${overrideModal()}`;
 bind();
}
function bind(){
 let s=$('#search');if(s)s.oninput=e=>{
   search=e.target.value; selectedId=null;
   let box=$('#suggestions'); if(!box)return;
   let sold=new Set(state.transactions.map(t=>t.playerId));
   let available=PLAYERS.filter(p=>p.role===state.settings.currentRole&&!sold.has(p.id));
   let q=search.trim().toLowerCase();
   if(!q){box.innerHTML='';box.classList.add('hidden');return}
   let sugs=available.filter(p=>(p.name+' '+p.team).toLowerCase().includes(q)).slice(0,12);
   box.innerHTML=sugs.map(p=>`<button onclick="choose(${p.id})"><b>${esc(p.name)}</b><span>${esc(p.team)} · rank ${p.rank} · FVM ${Math.round(p.fvm)}</span></button>`).join('')||'<div style="padding:10px">Nessun giocatore libero.</div>';
   box.classList.remove('hidden');
 };
 let p=$('#price');if(p)p.onchange=e=>setPrice(e.target.value);
 let b=$('#buyer');if(b)b.onchange=e=>buyerId=Number(e.target.value);
 let me=$('#meSel');if(me)me.onchange=e=>{state.settings.meId=Number(e.target.value);buyerId=state.settings.meId;roseTeam=state.settings.meId;save();render()};
 let rt=$('#roseTeam');if(rt)rt.onchange=e=>{roseTeam=Number(e.target.value);render()};
 let sq=$('#scoutQ');if(sq)sq.oninput=e=>{
   scoutQ=e.target.value;
   let box=document.querySelector('.scoutlist'); if(!box)return;
   let list=PLAYERS.filter(p=>p.role===scoutRole&&(p.name+' '+p.team).toLowerCase().includes(scoutQ.toLowerCase())).slice(0,80);
   box.innerHTML=list.map(p=>{let i=intel(p,state.overrides[p.id]);return `<button class="scoutrow" onclick="openOverride(${p.id})"><span><b>${esc(p.name)}</b><small>${esc(p.team)} · rank ${p.rank}</small></span><strong>${esc(i.tier)}</strong><em>${i.target??'auto'} / ${i.cap??'auto'}</em></button>`}).join('');
 };
 let sb=$('#setBudget');if(sb)sb.onchange=e=>{state.settings.initialBudget=Math.max(1,Number(e.target.value)||500);save();render()};
 document.querySelectorAll('.slot').forEach(x=>x.onchange=e=>{state.settings.slots[e.target.dataset.r]=Math.max(0,Number(e.target.value)||0);save()});
 document.querySelectorAll('.share').forEach(x=>x.onchange=e=>{state.settings.shares[e.target.dataset.r]=(Number(e.target.value)||0)/100;save()});
 document.querySelectorAll('.teamname').forEach(x=>x.onchange=e=>{let p=state.participants.find(y=>y.id===Number(e.target.dataset.id));if(p)p.name=e.target.value;save();render()});
}
function doTactical(){nomination=tactical();render()}
function openOverride(id){editId=id;render()}
function saveOverride(){state.overrides[editId]={tier:$('#ovTier').value,target:$('#ovTarget').value?Number($('#ovTarget').value):null,cap:$('#ovCap').value?Number($('#ovCap').value):null,note:$('#ovNote').value};editId=null;save();render()}
document.getElementById('restoreFile').onchange=e=>{let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(String(r.result));buyerId=state.settings.meId;roseTeam=state.settings.meId;save();notice='Backup importato.'}catch{notice='Backup non valido.'}render()};r.readAsText(f)};
render();
</script>
</body>
</html>
